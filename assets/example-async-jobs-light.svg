<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" fill="none" role="img" aria-label="Async job pipeline: a client posts a job, the API enqueues it and answers 202 at once; a worker later pulls the job, writes the result to the database and gets an acknowledgement, while metrics stream from the worker the whole time">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* m1: client submits a job */
    @keyframes m1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      8.75% { transform: translate(52px, 0px); opacity: 1; }
      10.25%, 100% { transform: translate(52px, 0px); opacity: 0; }
    }
    @keyframes m1-glow { 0%, 8.75% { opacity: 0; } 9.75% { opacity: 0.18; } 13.75%, 100% { opacity: 0; } }
    /* m2: api enqueues it */
    @keyframes m2 {
      0%, 12.5% { transform: translate(0, 0); opacity: 0; }
      13.25% { opacity: 1; }
      17.5% { transform: translate(40px, 0px); opacity: 1; }
      19%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 17.5% { transform: scale(0.4); opacity: 0; } 18% { transform: scale(0.5); opacity: 0.8; } 23.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 17.5% { opacity: 0; } 18.5% { opacity: 0.18; } 22.5%, 100% { opacity: 0; } }
    /* m3: 202 accepted goes straight back */
    @keyframes m3 {
      0%, 18.75% { transform: translate(0, 0); opacity: 0; }
      19.5% { opacity: 1; }
      20.75% { transform: translate(0px, -24px); }
      30.08% { transform: translate(-112px, -24px); }
      33.75% { transform: translate(-112px, 20px); opacity: 1; }
      35.25%, 100% { transform: translate(-112px, 20px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 33.75% { transform: scale(0.4); opacity: 0; } 34.25% { transform: scale(0.5); opacity: 0.8; } 40%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 36.25% { opacity: 1; } 37.5%, 100% { opacity: 0; } }
    /* m4: worker pulls the job */
    @keyframes m4 {
      0%, 40% { transform: translate(0, 0); opacity: 0; }
      40.75% { opacity: 1; }
      45% { transform: translate(40px, 0px); opacity: 1; }
      46.5%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 45% { transform: scale(0.4); opacity: 0; } 45.5% { transform: scale(0.5); opacity: 0.8; } 51.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 45% { opacity: 0; } 46% { opacity: 0.18; } 50%, 100% { opacity: 0; } }
    /* m5: worker writes the result */
    @keyframes m5 {
      0%, 48.75% { transform: translate(0, 0); opacity: 0; }
      49.5% { opacity: 1; }
      55% { transform: translate(0px, 48px); opacity: 1; }
      56.5%, 100% { transform: translate(0px, 48px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 55% { transform: scale(0.4); opacity: 0; } 55.5% { transform: scale(0.5); opacity: 0.8; } 61.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 55% { opacity: 0; } 56% { opacity: 0.18; } 60%, 100% { opacity: 0; } }
    /* m6: db acknowledges the commit */
    @keyframes m6 {
      0%, 58.75% { transform: translate(0, 0); opacity: 0; }
      59.5% { opacity: 1; }
      65% { transform: translate(0px, -48px); opacity: 1; }
      66.5%, 100% { transform: translate(0px, -48px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 65% { transform: scale(0.4); opacity: 0; } 65.5% { transform: scale(0.5); opacity: 0.8; } 71.25%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 36.25% { opacity: 0; } 37.5%, 73.75% { opacity: 1; } 75%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 73.75% { opacity: 0; } 75%, 97.5% { opacity: 1; } 98.75%, 100% { opacity: 0; } }
    /* s1: metrics never stop */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(40px, 0px); opacity: 1; }
      100% { transform: translate(40px, 0px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="359" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">ASYNC JOB PIPELINE</text>
  <text class="t-sub" x="28" y="66">Accept fast, process later; the client never waits on the database</text>
  <rect x="568" y="30" width="68" height="18" rx="9" fill="rgba(110,100,121,0.08)" stroke="rgba(110,100,121,0.5)"/>
  <text class="t-badge" x="602" y="42" text-anchor="middle">EXAMPLE</text>

  <!-- connectors: drawn before nodes so they sit behind -->
  <g stroke="#BFC0C0">
    <line x1="44" y1="148" x2="96" y2="148"/>
    <line x1="208" y1="148" x2="248" y2="148"/>
    <line x1="360" y1="148" x2="400" y2="148"/>
    <line x1="512" y1="148" x2="552" y2="148" stroke-dasharray="3 3"/>
    <line x1="436" y1="176" x2="436" y2="224"/>
    <line x1="476" y1="224" x2="476" y2="176"/>
    <path d="M152,120 V104 Q152,96 144,96 H48 Q40,96 40,104 V140"/>
  </g>
  <!-- direction chevrons at destinations (static readers need direction too) -->
  <g fill="#BFC0C0">
    <polygon points="90,145 96,148 90,151"/>
    <polygon points="242,145 248,148 242,151"/>
    <polygon points="394,145 400,148 394,151"/>
    <polygon points="433,218 436,224 439,218"/>
    <polygon points="473,182 476,176 479,182"/>
    <polygon points="37,134 40,140 43,134"/>
  </g>

  <!-- client -->
  <circle cx="40" cy="148" r="4" fill="#4F5D75"/>
  <text class="t-small" x="40" y="172" text-anchor="middle">CLIENT</text>

  <!-- api -->
  <rect x="96" y="120" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="110" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="120" y="140">API</text>
  <text class="t-desc" x="108" y="160">validate · 202</text>

  <!-- queue -->
  <rect x="248" y="120" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="262" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="272" y="140">QUEUE</text>
  <text class="t-desc" x="260" y="160">durable · fifo</text>

  <!-- worker -->
  <rect x="400" y="120" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="414" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-1.4s"/>
  <text class="t-name" x="424" y="140">WORKER</text>
  <text class="t-desc" x="412" y="160">pull · retry</text>

  <!-- metrics sink -->
  <rect x="552" y="120" width="80" height="56" rx="7" fill="#F5F5F5" stroke="#BFC0C0"/>
  <text class="t-name" x="564" y="140">METRICS</text>
  <text class="t-desc" x="564" y="160">sampled</text>

  <!-- db -->
  <rect x="400" y="224" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="414" cy="241" r="2.5" fill="#15803D" class="tick" style="animation-delay:-2.1s"/>
  <text class="t-name" x="424" y="244">DATABASE</text>
  <text class="t-desc" x="412" y="264">commit · ack</text>

  <!-- connector labels: masked, 6px clear of the stroke -->
  <text class="t-small" x="424" y="212" text-anchor="end">WRITE</text>
  <text class="t-small" x="488" y="212">ACK</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="308" text-anchor="middle">The 202 leaves before the worker even sees the job; durability is confirmed later, out of the request path.</text>

  <!-- @motion:elements -->
  <circle cx="44" cy="148" r="4" fill="#15803D" class="pkt" style="animation-name:m1"/>
  <rect x="96" y="120" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:m1-glow"/>
  <circle cx="208" cy="148" r="4" fill="#15803D" class="pkt" style="animation-name:m2"/>
  <circle cx="248" cy="148" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="248" y="120" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:m2-glow"/>
  <g class="pkt" style="animation-name:m3">
    <circle cx="152" cy="120" r="4" fill="#15803D"/>
    <text class="t-tag" x="152" y="108" text-anchor="middle" fill="#15803D">202</text>
  </g>
  <circle cx="40" cy="140" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph1;opacity:0">1 · ACCEPT</text>
  <circle cx="360" cy="148" r="4" fill="#15803D" class="pkt" style="animation-name:m4"/>
  <circle cx="400" cy="148" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="400" y="120" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:m4-glow"/>
  <circle cx="436" cy="176" r="4" fill="#15803D" class="pkt" style="animation-name:m5"/>
  <circle cx="436" cy="224" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="400" y="224" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:m5-glow"/>
  <circle cx="476" cy="224" r="4" fill="#15803D" class="pkt" style="animation-name:m6"/>
  <circle cx="476" cy="176" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#B8915A" style="animation-name:ph2;opacity:0">2 · PROCESS</text>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph3;opacity:0">3 · DURABLE</text>
  <circle cx="512" cy="148" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.2s;animation-delay:-0s"/>
  <circle cx="512" cy="148" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.2s;animation-delay:-0.4s"/>
  <circle cx="512" cy="148" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.2s;animation-delay:-0.8s"/>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="336" r="4" fill="#15803D"/>
  <text class="t-name" x="46" y="340">JOB MESSAGES</text>
  <circle cx="176" cy="336" r="2.5" fill="#2E5AA8"/>
  <text class="t-name" x="186" y="340">METRICS STREAM</text>
</svg>
