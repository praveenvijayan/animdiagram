<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" fill="none" role="img" aria-label="AI agent on Azure: a user prompt passes the application gateway once, the agent pod in AKS asks the Foundry models for a plan, retrieves documents from AI Search over a private endpoint, calls the models again and returns the answer through the gateway, while conversation state streams to Cosmos DB and some tool calls leave through the firewall to external MCP servers.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* a1: prompt hits the gateway */
    @keyframes a1 {
      0%, 2% { transform: translate(0, 0); opacity: 0; }
      2.6% { opacity: 1; }
      6% { transform: translate(68px, 0px); opacity: 1; }
      7.2%, 100% { transform: translate(68px, 0px); opacity: 0; }
    }
    @keyframes a1-glow { 0%, 6% { opacity: 0; } 6.8% { opacity: 0.3; } 10%, 100% { opacity: 0; } }
    /* a2: gateway forwards to the agent pod */
    @keyframes a2 {
      0%, 9% { transform: translate(0, 0); opacity: 0; }
      9.6% { opacity: 1; }
      12% { transform: translate(24px, 0px); opacity: 1; }
      13.2%, 100% { transform: translate(24px, 0px); opacity: 0; }
    }
    @keyframes a2-ring { 0%, 12% { transform: scale(0.4); opacity: 0; } 12.4% { transform: scale(0.5); opacity: 0.8; } 17%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a2-glow { 0%, 12% { opacity: 0; } 12.8% { opacity: 0.3; } 16%, 100% { opacity: 0; } }
    /* a3: agent asks the models for a plan */
    @keyframes a3 {
      0%, 15% { transform: translate(0, 0); opacity: 0; }
      15.6% { opacity: 1; }
      18% { transform: translate(28px, 0px); opacity: 1; }
      19.2%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes a3-ring { 0%, 18% { transform: scale(0.4); opacity: 0; } 18.4% { transform: scale(0.5); opacity: 0.8; } 23%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a3-glow { 0%, 18% { opacity: 0; } 18.8% { opacity: 0.3; } 22%, 100% { opacity: 0; } }
    /* a4: models answer with a tool call after inference */
    @keyframes a4 {
      0%, 23% { transform: translate(0, 0); opacity: 0; }
      23.6% { opacity: 1; }
      26% { transform: translate(-28px, 0px); opacity: 1; }
      27.2%, 100% { transform: translate(-28px, 0px); opacity: 0; }
    }
    @keyframes a4-ring { 0%, 26% { transform: scale(0.4); opacity: 0; } 26.4% { transform: scale(0.5); opacity: 0.8; } 31%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 30% { opacity: 1; } 31%, 100% { opacity: 0; } }
    /* a5: agent retrieves from ai search */
    @keyframes a5 {
      0%, 29% { transform: translate(0, 0); opacity: 0; }
      29.6% { opacity: 1; }
      32.91% { transform: translate(0px, 76px); }
      36% { transform: translate(60px, 76px); opacity: 1; }
      37.2%, 100% { transform: translate(60px, 76px); opacity: 0; }
    }
    @keyframes a5-ring { 0%, 36% { transform: scale(0.4); opacity: 0; } 36.4% { transform: scale(0.5); opacity: 0.8; } 41%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a5-glow { 0%, 36% { opacity: 0; } 36.8% { opacity: 0.3; } 40%, 100% { opacity: 0; } }
    /* a6: documents come back */
    @keyframes a6 {
      0%, 40% { transform: translate(0, 0); opacity: 0; }
      40.6% { opacity: 1; }
      42.26% { transform: translate(-44px, 0px); }
      47% { transform: translate(-44px, -92px); opacity: 1; }
      48.2%, 100% { transform: translate(-44px, -92px); opacity: 0; }
    }
    @keyframes a6-ring { 0%, 47% { transform: scale(0.4); opacity: 0; } 47.4% { transform: scale(0.5); opacity: 0.8; } 52%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 30% { opacity: 0; } 31%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }
    /* a7: second model call with the docs */
    @keyframes a7 {
      0%, 50% { transform: translate(0, 0); opacity: 0; }
      50.6% { opacity: 1; }
      53% { transform: translate(28px, 0px); opacity: 1; }
      54.2%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes a7-ring { 0%, 53% { transform: scale(0.4); opacity: 0; } 53.4% { transform: scale(0.5); opacity: 0.8; } 58%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes a7-glow { 0%, 53% { opacity: 0; } 53.8% { opacity: 0.3; } 57%, 100% { opacity: 0; } }
    /* a8: answer returns through the gateway */
    @keyframes a8 {
      0%, 59% { transform: translate(0, 0); opacity: 0; }
      59.6% { opacity: 1; }
      59.68% { transform: translate(0px, -16px); }
      69.48% { transform: translate(-232px, -16px); }
      71% { transform: translate(-232px, 20px); opacity: 1; }
      72.2%, 100% { transform: translate(-232px, 20px); opacity: 0; }
    }
    @keyframes a8-ring { 0%, 71% { transform: scale(0.4); opacity: 0; } 71.4% { transform: scale(0.5); opacity: 0.8; } 76%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 52% { opacity: 0; } 53%, 82% { opacity: 1; } 83%, 100% { opacity: 0; } }
    /* s1: conversation state written continuously */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(0px, 48px); opacity: 1; }
      100% { transform: translate(0px, 48px); opacity: 0; }
    }
    /* s2: some tool calls leave through the firewall */
    @keyframes s2 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      18.42% { transform: translate(0px, -24px); }
      81.58% { transform: translate(236px, -24px); }
      88% { transform: translate(236px, 0px); opacity: 1; }
      100% { transform: translate(236px, 0px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="439" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">AI AGENTS AT SCALE</text>
  <text class="t-sub" x="28" y="66">The prompt crosses the gateway once; everything after it stays on private endpoints inside the VNet.</text>

  <!-- private network zone -->
  <rect x="96" y="96" width="432" height="232" rx="12" fill="none" stroke="#363840" stroke-dasharray="4 4"/>
  <text class="t-zone" x="112" y="118">PRIVATE VNET · AKS</text>

  <!-- connectors -->
  <g stroke="#363840" stroke-width="1">
    <line x1="44" y1="180" x2="112" y2="180"/>
    <line x1="208" y1="180" x2="232" y2="180"/>
    <line x1="372" y1="172" x2="400" y2="172"/>
    <line x1="400" y1="188" x2="372" y2="188"/>
    <path d="M340,208 V276 Q340,284 348,284 H400"/>
    <path d="M400,300 H364 Q356,300 356,292 V208"/>
    <line x1="264" y1="208" x2="264" y2="256" stroke-dasharray="3 3"/>
    <path d="M272,152 V144 Q272,136 264,136 H48 Q40,136 40,144 V172"/>
    <path d="M356,152 V136 Q356,128 364,128 H528"/>
    <path d="M528,128 H584 Q592,128 592,136 V152" stroke-dasharray="4 3"/>
  </g>
  <g fill="#363840">
    <polygon points="106,177 112,180 106,183"/>
    <polygon points="226,177 232,180 226,183"/>
    <polygon points="394,169 400,172 394,175"/>
    <polygon points="378,185 372,188 378,191"/>
    <polygon points="394,281 400,284 394,287"/>
    <polygon points="353,214 356,208 359,214"/>
    <polygon points="261,250 264,256 267,250"/>
    <polygon points="37,166 40,172 43,166"/>
    <polygon points="589,146 592,152 595,146"/>
  </g>

  <!-- user -->
  <circle cx="40" cy="180" r="4" fill="#6F7987"/>
  <text class="t-small" x="40" y="204" text-anchor="middle">USER</text>

  <!-- gateway -->
  <rect x="112" y="152" width="96" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="126" cy="169" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="136" y="172">GATEWAY</text>
  <text class="t-desc" x="124" y="192">WAF · TLS</text>

  <!-- agent -->
  <rect x="232" y="152" width="140" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="246" cy="169" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="256" y="172">AGENT</text>
  <text class="t-desc" x="244" y="192">AKS pod · plan / act loop</text>

  <!-- models -->
  <rect x="400" y="152" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="414" cy="169" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="424" y="172">MODELS</text>
  <text class="t-desc" x="412" y="192">Foundry · private endpoint</text>

  <!-- cosmos -->
  <rect x="232" y="256" width="80" height="56" rx="7" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-name" x="244" y="276">COSMOS</text>
  <text class="t-desc" x="244" y="296">memory · state</text>

  <!-- ai search -->
  <rect x="400" y="256" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="414" cy="273" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.05s"/>
  <text class="t-name" x="424" y="276">AI SEARCH</text>
  <text class="t-desc" x="412" y="296">index · private endpoint</text>

  <!-- external mcp servers -->
  <rect x="552" y="152" width="80" height="56" rx="7" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-name" x="564" y="172">MCP</text>
  <text class="t-desc" x="564" y="192">external tools</text>

  <!-- connector labels -->
  <text class="t-small" x="536" y="120">FIREWALL</text>
  <text class="t-small" x="332" y="248" text-anchor="end">RETRIEVE</text>
  <text class="t-small" x="380" y="312" text-anchor="end">DOCS</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="384" text-anchor="middle">Only tool calls leave the network, and only through the firewall; models, index and memory are private endpoints.</text>

  <!-- @motion:elements -->
  <circle cx="44" cy="180" r="4" fill="#4CF490" class="pkt" style="animation-name:a1"/>
  <rect x="112" y="152" width="96" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:a1-glow"/>
  <circle cx="208" cy="180" r="4" fill="#4CF490" class="pkt" style="animation-name:a2"/>
  <circle cx="232" cy="180" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a2-ring"/>
  <rect x="232" y="152" width="140" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:a2-glow"/>
  <circle cx="372" cy="172" r="4" fill="#4CF490" class="pkt" style="animation-name:a3"/>
  <circle cx="400" cy="172" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a3-ring"/>
  <rect x="400" y="152" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:a3-glow"/>
  <g class="pkt" style="animation-name:a4">
    <circle cx="400" cy="188" r="4" fill="#4CF490"/>
    <text class="t-tag" x="400" y="201" text-anchor="middle" fill="#4CF490">TOOL</text>
  </g>
  <circle cx="372" cy="188" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a4-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · PLAN</text>
  <circle cx="340" cy="208" r="4" fill="#4CF490" class="pkt" style="animation-name:a5"/>
  <circle cx="400" cy="284" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a5-ring"/>
  <rect x="400" y="256" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:a5-glow"/>
  <g class="pkt" style="animation-name:a6">
    <circle cx="400" cy="300" r="4" fill="#4CF490"/>
    <text class="t-tag" x="400" y="312" text-anchor="middle" fill="#4CF490">DOCS</text>
  </g>
  <circle cx="356" cy="208" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a6-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#FBDC8E" style="animation-name:ph2;opacity:0">2 · RETRIEVE</text>
  <circle cx="372" cy="172" r="4" fill="#4CF490" class="pkt" style="animation-name:a7"/>
  <circle cx="400" cy="172" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a7-ring"/>
  <rect x="400" y="152" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:a7-glow"/>
  <g class="pkt" style="animation-name:a8">
    <circle cx="272" cy="152" r="4" fill="#4CF490"/>
    <text class="t-tag" x="272" y="140" text-anchor="middle" fill="#4CF490">ANSWER</text>
  </g>
  <circle cx="40" cy="172" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:a8-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · ANSWER</text>
  <circle cx="264" cy="208" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.4s;animation-delay:-0s"/>
  <circle cx="264" cy="208" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.4s;animation-delay:-0.47s"/>
  <circle cx="264" cy="208" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.4s;animation-delay:-0.93s"/>
  <circle cx="356" cy="152" r="2.5" fill="#FBDC8E" class="pkt" style="animation-name:s2;animation-duration:2.4s;animation-delay:-0s"/>
  <circle cx="356" cy="152" r="2.5" fill="#FBDC8E" class="pkt" style="animation-name:s2;animation-duration:2.4s;animation-delay:-1.2s"/>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="416" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="420">ONE PROMPT</text>
  <circle cx="176" cy="416" r="2.5" fill="#02BEFA"/>
  <text class="t-name" x="186" y="420">MEMORY WRITES</text>
  <circle cx="316" cy="416" r="2.5" fill="#FBDC8E"/>
  <text class="t-name" x="326" y="420">EXTERNAL TOOL CALLS</text>
</svg>
