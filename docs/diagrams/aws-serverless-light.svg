<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" fill="none" role="img" aria-label="Serverless web app on AWS: the browser calls API Gateway with a JWT, the gateway invokes a Lambda function that cold-starts, the function writes to DynamoDB and gets an acknowledgement, the result returns through the gateway as 201, while static assets stream from the CDN the whole time and a bar shows the function was billed only while it ran.">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* w1: browser calls the api with a jwt */
    @keyframes w1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      7.5% { transform: translate(52px, 0px); opacity: 1; }
      9%, 100% { transform: translate(52px, 0px); opacity: 0; }
    }
    @keyframes w1-glow { 0%, 7.5% { opacity: 0; } 8.5% { opacity: 0.18; } 12.5%, 100% { opacity: 0; } }
    /* w2: gateway invokes the function */
    @keyframes w2 {
      0%, 11.25% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      15% { transform: translate(40px, 0px); opacity: 1; }
      16.5%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes w2-ring { 0%, 15% { transform: scale(0.4); opacity: 0; } 15.5% { transform: scale(0.5); opacity: 0.8; } 21.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes w2-glow { 0%, 15% { opacity: 0; } 16% { opacity: 0.18; } 20%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 15% { opacity: 1; } 16.25%, 100% { opacity: 0; } }
    /* ph2: act 2: the function is being provisioned */
    @keyframes ph2 { 0%, 15% { opacity: 0; } 16.25%, 31.25% { opacity: 1; } 32.5%, 100% { opacity: 0; } }
    /* w3: function writes the item after the cold start */
    @keyframes w3 {
      0%, 32.5% { transform: translate(0, 0); opacity: 0; }
      33.25% { opacity: 1; }
      37.5% { transform: translate(40px, 0px); opacity: 1; }
      39%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes w3-ring { 0%, 37.5% { transform: scale(0.4); opacity: 0; } 38% { transform: scale(0.5); opacity: 0.8; } 43.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes w3-glow { 0%, 37.5% { opacity: 0; } 38.5% { opacity: 0.18; } 42.5%, 100% { opacity: 0; } }
    /* w4: dynamodb acknowledges */
    @keyframes w4 {
      0%, 41.25% { transform: translate(0, 0); opacity: 0; }
      42% { opacity: 1; }
      46.25% { transform: translate(-40px, 0px); opacity: 1; }
      47.75%, 100% { transform: translate(-40px, 0px); opacity: 0; }
    }
    @keyframes w4-ring { 0%, 46.25% { transform: scale(0.4); opacity: 0; } 46.75% { transform: scale(0.5); opacity: 0.8; } 52.5%, 100% { transform: scale(1.4); opacity: 0; } }
    /* w5: function returns to the gateway */
    @keyframes w5 {
      0%, 48.75% { transform: translate(0, 0); opacity: 0; }
      49.5% { opacity: 1; }
      52.5% { transform: translate(-40px, 0px); opacity: 1; }
      54%, 100% { transform: translate(-40px, 0px); opacity: 0; }
    }
    @keyframes w5-ring { 0%, 52.5% { transform: scale(0.4); opacity: 0; } 53% { transform: scale(0.5); opacity: 0.8; } 58.75%, 100% { transform: scale(1.4); opacity: 0; } }
    /* w6: 201 back to the browser */
    @keyframes w6 {
      0%, 56.25% { transform: translate(0, 0); opacity: 0; }
      57% { opacity: 1; }
      57.92% { transform: translate(0px, -24px); }
      65.69% { transform: translate(-112px, -24px); }
      68.75% { transform: translate(-112px, 20px); opacity: 1; }
      70.25%, 100% { transform: translate(-112px, 20px); opacity: 0; }
    }
    @keyframes w6-ring { 0%, 68.75% { transform: scale(0.4); opacity: 0; } 69.25% { transform: scale(0.5); opacity: 0.8; } 75%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 31.25% { opacity: 0; } 32.5%, 67.5% { opacity: 1; } 68.75%, 100% { opacity: 0; } }
    /* b1: billed duration grows only while the function runs */
    @keyframes b1 { 0%, 13.75% { transform: scaleX(0); } 15%, 31.25% { transform: scaleX(0.15); } 32.5%, 36.25% { transform: scaleX(0.45); } 37.5%, 41.25% { transform: scaleX(0.7); } 42.5%, 47.5% { transform: scaleX(0.9); } 48.75%, 96% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    /* s1: static assets keep coming from the cdn */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      60% { transform: translate(0px, 96px); }
      88% { transform: translate(56px, 96px); opacity: 1; }
      100% { transform: translate(56px, 96px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="379" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">SERVERLESS WEB APP</text>
  <text class="t-sub" x="28" y="66">No server waits for the request; each hop exists, and is billed, only while it runs.</text>

  <g stroke="#BFC0C0" stroke-width="1">
    <line x1="44" y1="148" x2="96" y2="148"/>
    <path d="M152,120 V104 Q152,96 144,96 H48 Q40,96 40,104 V140"/>
    <line x1="208" y1="140" x2="248" y2="140"/>
    <line x1="248" y1="156" x2="208" y2="156"/>
    <line x1="360" y1="140" x2="400" y2="140"/>
    <line x1="400" y1="156" x2="360" y2="156"/>
    <path d="M40,156 V244 Q40,252 48,252 H96" stroke-dasharray="3 3"/>
  </g>
  <g fill="#BFC0C0">
    <polygon points="90,145 96,148 90,151"/>
    <polygon points="37,134 40,140 43,134"/>
    <polygon points="242,137 248,140 242,143"/>
    <polygon points="214,153 208,156 214,159"/>
    <polygon points="394,137 400,140 394,143"/>
    <polygon points="366,153 360,156 366,159"/>
    <polygon points="90,249 96,252 90,255"/>
  </g>

  <circle cx="40" cy="148" r="4" fill="#4F5D75"/>
  <text class="t-small" x="40" y="172" text-anchor="middle">BROWSER</text>

  <rect x="96" y="120" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="110" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0s"/>
  <text class="t-name" x="120" y="140">API GATEWAY</text>
  <text class="t-desc" x="108" y="160">authorizer · route</text>
  <rect x="248" y="120" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="262" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="272" y="140">LAMBDA</text>
  <text class="t-desc" x="260" y="160">handler · on demand</text>
  <rect x="400" y="120" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="414" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="424" y="140">DYNAMODB</text>
  <text class="t-desc" x="412" y="160">on-demand · put</text>
  <rect x="96" y="224" width="112" height="56" rx="7" fill="#F5F5F5" stroke="#BFC0C0"/>
  <text class="t-name" x="108" y="244">CDN · S3</text>
  <text class="t-desc" x="108" y="264">static assets</text>

  <!-- billed time under the function -->
  <rect x="248" y="188" width="112" height="4" rx="2" fill="#D9DADB"/>
  <text class="t-small" x="368" y="192">BILLED MS</text>

  <text class="t-small" x="228" y="132" text-anchor="middle">INVOKE</text>
  <text class="t-small" x="380" y="132" text-anchor="middle">PUT</text>

  <text class="t-prose" x="330" y="328" text-anchor="middle">The browser keeps getting HTML from the CDN; the function exists only for the few hundred milliseconds it takes to answer.</text>

  <!-- @motion:elements -->
  <g class="pkt" style="animation-name:w1">
    <circle cx="44" cy="148" r="4" fill="#15803D"/>
    <text class="t-tag" x="44" y="136" text-anchor="middle" fill="#15803D">JWT</text>
  </g>
  <rect x="96" y="120" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:w1-glow"/>
  <circle cx="208" cy="140" r="4" fill="#15803D" class="pkt" style="animation-name:w2"/>
  <circle cx="248" cy="140" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:w2-ring"/>
  <rect x="248" y="120" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:w2-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph1;opacity:0">1 · INVOKE</text>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#B8915A" style="animation-name:ph2;opacity:0">2 · COLD START</text>
  <circle cx="360" cy="140" r="4" fill="#15803D" class="pkt" style="animation-name:w3"/>
  <circle cx="400" cy="140" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:w3-ring"/>
  <rect x="400" y="120" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:w3-glow"/>
  <circle cx="400" cy="156" r="4" fill="#15803D" class="pkt" style="animation-name:w4"/>
  <circle cx="360" cy="156" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:w4-ring"/>
  <circle cx="248" cy="156" r="4" fill="#15803D" class="pkt" style="animation-name:w5"/>
  <circle cx="208" cy="156" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:w5-ring"/>
  <g class="pkt" style="animation-name:w6">
    <circle cx="152" cy="120" r="4" fill="#15803D"/>
    <text class="t-tag" x="152" y="108" text-anchor="middle" fill="#15803D">201</text>
  </g>
  <circle cx="40" cy="140" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:w6-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph3;opacity:0">3 · RUN · RETURN</text>
  <rect x="248" y="188" width="112" height="4" rx="2" fill="#15803D" fill-opacity="0.6" class="bar" style="animation-name:b1"/>
  <circle cx="40" cy="156" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-0s"/>
  <circle cx="40" cy="156" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-0.53s"/>
  <circle cx="40" cy="156" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-1.07s"/>
  <!-- @/motion:elements -->

  <circle cx="36" cy="356" r="4" fill="#15803D"/>
  <text class="t-name" x="46" y="360">API REQUEST</text>
  <circle cx="176" cy="356" r="2.5" fill="#2E5AA8"/>
  <text class="t-name" x="186" y="360">STATIC ASSETS</text>
  <circle cx="316" cy="356" r="4" fill="#B8915A"/>
  <text class="t-name" x="326" y="360">COLD START</text>
</svg>
