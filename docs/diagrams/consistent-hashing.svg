<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" fill="none" role="img" aria-label="Consistent hashing: four servers sit on a hash space and each key is routed to the next server along the space, wrapping around at the end. A fifth server joins between S0 and S1; only key K0, which now falls before S4, moves to it, and K1, K2 and K3 route exactly as before.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* k0: k0 walks the space to s1 */
    @keyframes k0 {
      0%, 2% { transform: translate(0, 0); opacity: 0; }
      2.6% { opacity: 1; }
      3.3% { transform: translate(0px, -32px); }
      7.03% { transform: translate(92px, -32px); }
      8% { transform: translate(92px, -56px); opacity: 1; }
      9.2%, 100% { transform: translate(92px, -56px); opacity: 0; }
    }
    @keyframes k0-ring { 0%, 8% { transform: scale(0.4); opacity: 0; } 8.4% { transform: scale(0.5); opacity: 0.8; } 13%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k0-glow { 0%, 8% { opacity: 0; } 8.8% { opacity: 0.3; } 12%, 100% { opacity: 0; } }
    /* k1: k1 to s2 */
    @keyframes k1 {
      0%, 9% { transform: translate(0, 0); opacity: 0; }
      9.6% { opacity: 1; }
      10.18% { transform: translate(0px, -32px); }
      13.12% { transform: translate(80px, -32px); }
      14% { transform: translate(80px, -56px); opacity: 1; }
      15.2%, 100% { transform: translate(80px, -56px); opacity: 0; }
    }
    @keyframes k1-ring { 0%, 14% { transform: scale(0.4); opacity: 0; } 14.4% { transform: scale(0.5); opacity: 0.8; } 19%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k1-glow { 0%, 14% { opacity: 0; } 14.8% { opacity: 0.3; } 18%, 100% { opacity: 0; } }
    /* k2: k2 to s3 */
    @keyframes k2 {
      0%, 15% { transform: translate(0, 0); opacity: 0; }
      15.6% { opacity: 1; }
      16.18% { transform: translate(0px, -32px); }
      19.12% { transform: translate(80px, -32px); }
      20% { transform: translate(80px, -56px); opacity: 1; }
      21.2%, 100% { transform: translate(80px, -56px); opacity: 0; }
    }
    @keyframes k2-ring { 0%, 20% { transform: scale(0.4); opacity: 0; } 20.4% { transform: scale(0.5); opacity: 0.8; } 25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k2-glow { 0%, 20% { opacity: 0; } 20.8% { opacity: 0.3; } 24%, 100% { opacity: 0; } }
    /* k3: k3 wraps around to s0 */
    @keyframes k3 {
      0%, 21% { transform: translate(0, 0); opacity: 0; }
      21.58% { opacity: 1; }
      21.59% { transform: translate(0px, -32px); }
      22.33% { transform: translate(40px, -32px); }
      23.5% { transform: translate(40px, -96px); }
      32.71% { transform: translate(-460px, -96px); }
      33% { transform: translate(-460px, -80px); opacity: 1; }
      34.2%, 100% { transform: translate(-460px, -80px); opacity: 0; }
    }
    @keyframes k3-ring { 0%, 33% { transform: scale(0.4); opacity: 0; } 33.4% { transform: scale(0.5); opacity: 0.8; } 38%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k3-glow { 0%, 33% { opacity: 0; } 33.8% { opacity: 0.3; } 37%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 40% { opacity: 1; } 41%, 100% { opacity: 0; } }
    /* join: s4 joins between s0 and s1 and stays */
    @keyframes join { 0%, 43% { opacity: 0; } 44%, 96% { opacity: 1; } 97%, 100% { opacity: 0; } }
    /* jp: join ring on s4 */
    @keyframes jp { 0%, 44% { transform: scale(0.4); opacity: 0; } 44.48% { transform: scale(0.5); opacity: 0.8; } 50%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 41% { opacity: 0; } 42%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    /* k0b: only k0 changes owner: s4 is now next */
    @keyframes k0b {
      0%, 53% { transform: translate(0, 0); opacity: 0; }
      53.6% { opacity: 1; }
      54.6% { transform: translate(0px, -32px); }
      55.8% { transform: translate(24px, -32px); }
      57% { transform: translate(24px, -56px); opacity: 1; }
      58.2%, 100% { transform: translate(24px, -56px); opacity: 0; }
    }
    @keyframes k0b-ring { 0%, 57% { transform: scale(0.4); opacity: 0; } 57.4% { transform: scale(0.5); opacity: 0.8; } 62%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k0b-glow { 0%, 57% { opacity: 0; } 57.8% { opacity: 0.3; } 61%, 100% { opacity: 0; } }
    /* k1b: k1 unchanged */
    @keyframes k1b {
      0%, 59% { transform: translate(0, 0); opacity: 0; }
      59.6% { opacity: 1; }
      59.94% { transform: translate(0px, -32px); }
      62.29% { transform: translate(80px, -32px); }
      63% { transform: translate(80px, -56px); opacity: 1; }
      64.2%, 100% { transform: translate(80px, -56px); opacity: 0; }
    }
    @keyframes k1b-ring { 0%, 63% { transform: scale(0.4); opacity: 0; } 63.4% { transform: scale(0.5); opacity: 0.8; } 68%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k1b-glow { 0%, 63% { opacity: 0; } 63.8% { opacity: 0.3; } 67%, 100% { opacity: 0; } }
    /* k2b: k2 unchanged */
    @keyframes k2b {
      0%, 64% { transform: translate(0, 0); opacity: 0; }
      64.6% { opacity: 1; }
      64.94% { transform: translate(0px, -32px); }
      67.29% { transform: translate(80px, -32px); }
      68% { transform: translate(80px, -56px); opacity: 1; }
      69.2%, 100% { transform: translate(80px, -56px); opacity: 0; }
    }
    @keyframes k2b-ring { 0%, 68% { transform: scale(0.4); opacity: 0; } 68.4% { transform: scale(0.5); opacity: 0.8; } 73%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k2b-glow { 0%, 68% { opacity: 0; } 68.8% { opacity: 0.3; } 72%, 100% { opacity: 0; } }
    /* k3b: k3 unchanged */
    @keyframes k3b {
      0%, 69% { transform: translate(0, 0); opacity: 0; }
      69.48% { opacity: 1; }
      69.49% { transform: translate(0px, -32px); }
      70.1% { transform: translate(40px, -32px); }
      71.09% { transform: translate(40px, -96px); }
      78.75% { transform: translate(-460px, -96px); }
      79% { transform: translate(-460px, -80px); opacity: 1; }
      80.2%, 100% { transform: translate(-460px, -80px); opacity: 0; }
    }
    @keyframes k3b-ring { 0%, 79% { transform: scale(0.4); opacity: 0; } 79.4% { transform: scale(0.5); opacity: 0.8; } 84%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes k3b-glow { 0%, 79% { opacity: 0; } 79.8% { opacity: 0.3; } 83%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 50% { opacity: 0; } 51%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="359" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">CONSISTENT HASHING</text>
  <text class="t-sub" x="28" y="66">Adding a server moves only the keys between it and its predecessor; every other key stays put.</text>

  <!-- hash space: a line that wraps back to its start -->
  <g stroke="#363840" stroke-width="1">
    <line x1="60" y1="200" x2="600" y2="200"/>
    <path d="M600,200 V144 Q600,136 592,136 H68 Q60,136 60,144 V200" stroke-dasharray="4 4"/>
    <line x1="100" y1="176" x2="100" y2="200"/>
    <line x1="100" y1="136" x2="100" y2="152"/>
    <line x1="240" y1="176" x2="240" y2="200"/>
    <line x1="380" y1="176" x2="380" y2="200"/>
    <line x1="520" y1="176" x2="520" y2="200"/>
    <line x1="172" y1="176" x2="172" y2="200" stroke-dasharray="2 2"/>
    <line x1="148" y1="228" x2="148" y2="200" stroke-dasharray="2 2"/>
    <line x1="300" y1="228" x2="300" y2="200" stroke-dasharray="2 2"/>
    <line x1="440" y1="228" x2="440" y2="200" stroke-dasharray="2 2"/>
    <line x1="560" y1="228" x2="560" y2="200" stroke-dasharray="2 2"/>
  </g>
  <g fill="#363840">
    <polygon points="594,197 600,200 594,203"/>
    <polygon points="97,146 100,152 103,146"/>
  </g>
  <text class="t-small" x="52" y="204" text-anchor="end">0</text>
  <text class="t-small" x="608" y="204">2³²</text>
  <text class="t-zone" x="330" y="124" text-anchor="middle">HASH SPACE · KEY GOES TO THE NEXT SERVER →</text>

  <rect x="72" y="152" width="56" height="24" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-name" x="100" y="168" text-anchor="middle">S0</text>
  <rect x="212" y="152" width="56" height="24" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-name" x="240" y="168" text-anchor="middle">S1</text>
  <rect x="352" y="152" width="56" height="24" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-name" x="380" y="168" text-anchor="middle">S2</text>
  <rect x="492" y="152" width="56" height="24" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-name" x="520" y="168" text-anchor="middle">S3</text>
  <rect x="144" y="152" width="56" height="24" rx="6" fill="#141416" stroke="#363840" stroke-dasharray="2 2"/>
  <text class="t-name" x="172" y="168" text-anchor="middle">S4 · NEW</text>

  <!-- keys on the space -->
  <circle cx="148" cy="232" r="4" fill="#6F7987"/><text class="t-small" x="148" y="252" text-anchor="middle">K0</text>
  <circle cx="300" cy="232" r="4" fill="#6F7987"/><text class="t-small" x="300" y="252" text-anchor="middle">K1</text>
  <circle cx="440" cy="232" r="4" fill="#6F7987"/><text class="t-small" x="440" y="252" text-anchor="middle">K2</text>
  <circle cx="560" cy="232" r="4" fill="#6F7987"/><text class="t-small" x="560" y="252" text-anchor="middle">K3</text>

  <!-- S4 becomes a real server when it joins (window generated as 'join') -->
  <g class="story" style="animation-name:join;opacity:0">
    <rect x="144" y="152" width="56" height="24" rx="6" fill="#141416" stroke="#FBDC8E"/>
    <text class="t-name" x="172" y="168" text-anchor="middle">S4</text>
    <line x1="172" y1="176" x2="172" y2="200" stroke="#363840"/>
  </g>

  <text class="t-prose" x="330" y="296" text-anchor="middle">With modulo hashing every key would move; here the blast radius of a new node is one arc of the space.</text>

  <!-- @motion:elements -->
  <circle cx="148" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k0"/>
  <circle cx="240" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k0-ring"/>
  <rect x="212" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k0-glow"/>
  <circle cx="300" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k1"/>
  <circle cx="380" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k1-ring"/>
  <rect x="352" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k1-glow"/>
  <circle cx="440" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k2"/>
  <circle cx="520" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k2-ring"/>
  <rect x="492" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k2-glow"/>
  <circle cx="560" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k3"/>
  <circle cx="100" cy="152" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k3-ring"/>
  <rect x="72" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k3-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · FOUR SERVERS</text>
  <circle cx="172" cy="164" r="14" fill="none" stroke="#FBDC8E" stroke-width="1.5" class="ring" style="animation-name:jp"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#FBDC8E" style="animation-name:ph2;opacity:0">2 · S4 JOINS</text>
  <circle cx="148" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k0b"/>
  <circle cx="172" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k0b-ring"/>
  <rect x="144" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k0b-glow"/>
  <circle cx="300" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k1b"/>
  <circle cx="380" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k1b-ring"/>
  <rect x="352" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k1b-glow"/>
  <circle cx="440" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k2b"/>
  <circle cx="520" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k2b-ring"/>
  <rect x="492" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k2b-glow"/>
  <circle cx="560" cy="232" r="4" fill="#4CF490" class="pkt" style="animation-name:k3b"/>
  <circle cx="100" cy="152" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:k3b-ring"/>
  <rect x="72" y="152" width="56" height="24" rx="6" fill="#4CF490" class="glow" style="animation-name:k3b-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · ONLY K0 MOVES</text>
  <!-- @/motion:elements -->

  <circle cx="36" cy="336" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="340">KEY → OWNER</text>
  <circle cx="176" cy="336" r="4" fill="#FBDC8E"/>
  <text class="t-name" x="186" y="340">SERVER JOINS</text>
</svg>
