<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" fill="none" role="img" aria-label="Streaming analytics on Google Cloud: one device publishes an event to Pub/Sub and gets an acknowledgement at once; Dataflow pulls the event, windows it, writes it to BigQuery and archives the raw copy to Cloud Storage at the same time, then acknowledges the subscription, while other devices keep publishing.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* e1: device publishes an event */
    @keyframes e1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      7.5% { transform: translate(52px, 0px); opacity: 1; }
      9%, 100% { transform: translate(52px, 0px); opacity: 0; }
    }
    @keyframes e1-ring { 0%, 7.5% { transform: scale(0.4); opacity: 0; } 8% { transform: scale(0.5); opacity: 0.8; } 13.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes e1-glow { 0%, 7.5% { opacity: 0; } 8.5% { opacity: 0.3; } 12.5%, 100% { opacity: 0; } }
    /* e2: pub/sub acks the device at once */
    @keyframes e2 {
      0%, 10% { transform: translate(0, 0); opacity: 0; }
      10.75% { opacity: 1; }
      15% { transform: translate(-52px, 0px); opacity: 1; }
      16.5%, 100% { transform: translate(-52px, 0px); opacity: 0; }
    }
    @keyframes e2-ring { 0%, 15% { transform: scale(0.4); opacity: 0; } 15.5% { transform: scale(0.5); opacity: 0.8; } 21.25%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 17.5% { opacity: 1; } 18.75%, 100% { opacity: 0; } }
    /* e3: dataflow pulls the event */
    @keyframes e3 {
      0%, 18.75% { transform: translate(0, 0); opacity: 0; }
      19.5% { opacity: 1; }
      23.75% { transform: translate(40px, 0px); opacity: 1; }
      25.25%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes e3-ring { 0%, 23.75% { transform: scale(0.4); opacity: 0; } 24.25% { transform: scale(0.5); opacity: 0.8; } 30%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes e3-glow { 0%, 23.75% { opacity: 0; } 24.75% { opacity: 0.3; } 28.75%, 100% { opacity: 0; } }
    /* ph2: act 2: windowing */
    @keyframes ph2 { 0%, 17.5% { opacity: 0; } 18.75%, 36.25% { opacity: 1; } 37.5%, 100% { opacity: 0; } }
    /* e4: streaming insert into bigquery */
    @keyframes e4 {
      0%, 36.25% { transform: translate(0, 0); opacity: 0; }
      37% { opacity: 1; }
      41.25% { transform: translate(40px, 0px); opacity: 1; }
      42.75%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes e4-ring { 0%, 41.25% { transform: scale(0.4); opacity: 0; } 41.75% { transform: scale(0.5); opacity: 0.8; } 47.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes e4-glow { 0%, 41.25% { opacity: 0; } 42.25% { opacity: 0.3; } 46.25%, 100% { opacity: 0; } }
    /* e5: raw copy archived at the same time */
    @keyframes e5 {
      0%, 36.25% { transform: translate(0, 0); opacity: 0; }
      37% { opacity: 1; }
      41.22% { transform: translate(0px, 76px); }
      47.5% { transform: translate(96px, 76px); opacity: 1; }
      49%, 100% { transform: translate(96px, 76px); opacity: 0; }
    }
    @keyframes e5-ring { 0%, 47.5% { transform: scale(0.4); opacity: 0; } 48% { transform: scale(0.5); opacity: 0.8; } 53.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes e5-glow { 0%, 47.5% { opacity: 0; } 48.5% { opacity: 0.3; } 52.5%, 100% { opacity: 0; } }
    /* e6: subscription acked only after both writes */
    @keyframes e6 {
      0%, 51.25% { transform: translate(0, 0); opacity: 0; }
      52% { opacity: 1; }
      56.25% { transform: translate(-40px, 0px); opacity: 1; }
      57.75%, 100% { transform: translate(-40px, 0px); opacity: 0; }
    }
    @keyframes e6-ring { 0%, 56.25% { transform: scale(0.4); opacity: 0; } 56.75% { transform: scale(0.5); opacity: 0.8; } 62.5%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 36.25% { opacity: 0; } 37.5%, 65% { opacity: 1; } 66.25%, 100% { opacity: 0; } }
    /* s1: other devices keep publishing */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(52px, 0px); opacity: 1; }
      100% { transform: translate(52px, 0px); opacity: 0; }
    }
    /* s2: other devices keep publishing */
    @keyframes s2 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(52px, 0px); opacity: 1; }
      100% { transform: translate(52px, 0px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="379" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">STREAMING ON GCP</text>
  <text class="t-sub" x="28" y="66">The producer is acknowledged immediately; the warehouse write happens later, off the device's clock.</text>

  <g stroke="#363840" stroke-width="1">
    <line x1="44" y1="132" x2="96" y2="132" stroke-dasharray="3 3"/>
    <line x1="44" y1="148" x2="96" y2="148"/>
    <line x1="44" y1="164" x2="96" y2="164" stroke-dasharray="3 3"/>
    <line x1="208" y1="140" x2="248" y2="140"/>
    <line x1="248" y1="156" x2="208" y2="156"/>
    <line x1="360" y1="140" x2="400" y2="140"/>
    <path d="M304,176 V244 Q304,252 312,252 H400"/>
  </g>
  <g fill="#363840">
    <polygon points="90,145 96,148 90,151"/>
    <polygon points="242,137 248,140 242,143"/>
    <polygon points="214,153 208,156 214,159"/>
    <polygon points="394,137 400,140 394,143"/>
    <polygon points="394,249 400,252 394,255"/>
  </g>

  <text class="t-small" x="40" y="116" text-anchor="middle">DEVICES</text>
  <circle cx="40" cy="132" r="4" fill="#6F7987"/>
  <circle cx="40" cy="148" r="4" fill="#6F7987"/>
  <circle cx="40" cy="164" r="4" fill="#6F7987"/>

  <rect x="96" y="120" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="110" cy="137" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0s"/>
  <text class="t-name" x="120" y="140">PUB/SUB</text>
  <text class="t-desc" x="108" y="160">topic · at-least-once</text>
  <rect x="248" y="120" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="262" cy="137" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="272" y="140">DATAFLOW</text>
  <text class="t-desc" x="260" y="160">window · dedupe</text>
  <rect x="400" y="120" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="414" cy="137" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="424" y="140">BIGQUERY</text>
  <text class="t-desc" x="412" y="160">streaming insert</text>
  <rect x="400" y="224" width="112" height="56" rx="7" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-name" x="412" y="244">CLOUD STORAGE</text>
  <text class="t-desc" x="412" y="264">raw archive</text>

  <text class="t-small" x="228" y="132" text-anchor="middle">PULL</text>
  <text class="t-small" x="380" y="132" text-anchor="middle">INSERT</text>
  <text class="t-small" x="312" y="244">ARCHIVE</text>

  <text class="t-prose" x="330" y="328" text-anchor="middle">Pub/Sub decouples the two clocks: devices see a millisecond ack, the pipeline takes its time to window and commit.</text>

  <!-- @motion:elements -->
  <circle cx="44" cy="148" r="4" fill="#4CF490" class="pkt" style="animation-name:e1"/>
  <circle cx="96" cy="148" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:e1-ring"/>
  <rect x="96" y="120" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:e1-glow"/>
  <circle cx="96" cy="148" r="4" fill="#4CF490" class="pkt" style="animation-name:e2"/>
  <circle cx="44" cy="148" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:e2-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · PUBLISH</text>
  <circle cx="208" cy="140" r="4" fill="#4CF490" class="pkt" style="animation-name:e3"/>
  <circle cx="248" cy="140" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:e3-ring"/>
  <rect x="248" y="120" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:e3-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#FBDC8E" style="animation-name:ph2;opacity:0">2 · WINDOW</text>
  <circle cx="360" cy="140" r="4" fill="#4CF490" class="pkt" style="animation-name:e4"/>
  <circle cx="400" cy="140" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:e4-ring"/>
  <rect x="400" y="120" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:e4-glow"/>
  <circle cx="304" cy="176" r="4" fill="#4CF490" class="pkt" style="animation-name:e5"/>
  <circle cx="400" cy="252" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:e5-ring"/>
  <rect x="400" y="224" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:e5-glow"/>
  <g class="pkt" style="animation-name:e6">
    <circle cx="248" cy="156" r="4" fill="#4CF490"/>
    <text class="t-tag" x="248" y="170" text-anchor="middle" fill="#4CF490">ACK</text>
  </g>
  <circle cx="208" cy="156" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:e6-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · COMMIT</text>
  <circle cx="44" cy="132" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-0s"/>
  <circle cx="44" cy="132" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-0.8s"/>
  <circle cx="44" cy="164" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s2;animation-duration:1.6s;animation-delay:-0.8s"/>
  <circle cx="44" cy="164" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s2;animation-duration:1.6s;animation-delay:-1.6s"/>
  <!-- @/motion:elements -->

  <circle cx="36" cy="356" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="360">ONE EVENT</text>
  <circle cx="176" cy="356" r="2.5" fill="#02BEFA"/>
  <text class="t-name" x="186" y="360">OTHER DEVICES</text>
</svg>
