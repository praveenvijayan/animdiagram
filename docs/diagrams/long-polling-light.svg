<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" fill="none" role="img" aria-label="Short polling versus long polling: on the left the client asks the chat server every second and gets an empty reply every time; on the right the client asks once, the server holds the request open until another user sends a message, answers with it, and the client immediately asks again.">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* p1: client asks once */
    @keyframes p1 {
      0%, 2% { transform: translate(0, 0); opacity: 0; }
      2.6% { opacity: 1; }
      8% { transform: translate(52px, 0px); opacity: 1; }
      9.2%, 100% { transform: translate(52px, 0px); opacity: 0; }
    }
    @keyframes p1-ring { 0%, 8% { transform: scale(0.4); opacity: 0; } 8.4% { transform: scale(0.5); opacity: 0.8; } 13%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes p1-glow { 0%, 8% { opacity: 0; } 8.8% { opacity: 0.18; } 12%, 100% { opacity: 0; } }
    /* held: request parked until there is something to say */
    @keyframes held { 0%, 8% { opacity: 0; } 9%, 39% { opacity: 1; } 40%, 100% { opacity: 0; } }
    /* p2: another user sends a message */
    @keyframes p2 {
      0%, 36% { transform: translate(0, 0); opacity: 0; }
      36.6% { opacity: 1; }
      41% { transform: translate(-56px, 0px); opacity: 1; }
      42.2%, 100% { transform: translate(-56px, 0px); opacity: 0; }
    }
    @keyframes p2-ring { 0%, 41% { transform: scale(0.4); opacity: 0; } 41.4% { transform: scale(0.5); opacity: 0.8; } 46%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes p2-glow { 0%, 41% { opacity: 0; } 41.8% { opacity: 0.18; } 45%, 100% { opacity: 0; } }
    /* p3: the held request is answered with it */
    @keyframes p3 {
      0%, 43% { transform: translate(0, 0); opacity: 0; }
      43.6% { opacity: 1; }
      49% { transform: translate(-52px, 0px); opacity: 1; }
      50.2%, 100% { transform: translate(-52px, 0px); opacity: 0; }
    }
    @keyframes p3-ring { 0%, 49% { transform: scale(0.4); opacity: 0; } 49.4% { transform: scale(0.5); opacity: 0.8; } 54%, 100% { transform: scale(1.4); opacity: 0; } }
    /* p4: client asks again immediately */
    @keyframes p4 {
      0%, 51% { transform: translate(0, 0); opacity: 0; }
      51.6% { opacity: 1; }
      57% { transform: translate(52px, 0px); opacity: 1; }
      58.2%, 100% { transform: translate(52px, 0px); opacity: 0; }
    }
    @keyframes p4-ring { 0%, 57% { transform: scale(0.4); opacity: 0; } 57.4% { transform: scale(0.5); opacity: 0.8; } 62%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes p4-glow { 0%, 57% { opacity: 0; } 57.8% { opacity: 0.18; } 61%, 100% { opacity: 0; } }
    /* held2: parked again, nothing else happens */
    @keyframes held2 { 0%, 57% { opacity: 0; } 58%, 96% { opacity: 1; } 97%, 100% { opacity: 0; } }
    /* s1: short polling: a request every second */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(52px, 0px); opacity: 1; }
      100% { transform: translate(52px, 0px); opacity: 0; }
    }
    /* s2: …and an empty reply every second */
    @keyframes s2 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(-52px, 0px); opacity: 1; }
      100% { transform: translate(-52px, 0px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="359" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">LONG POLLING</text>
  <text class="t-sub" x="28" y="66">Ask once and let the server hold the request until something happens; idle round trips disappear.</text>

  <!-- panels -->
  <rect x="32" y="96" width="288" height="200" rx="10" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="48" y="120" font-weight="600">SHORT POLLING</text>
  <rect x="340" y="96" width="288" height="200" rx="10" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="356" y="120" font-weight="600">LONG POLLING</text>

  <g stroke="#BFC0C0" stroke-width="1">
    <line x1="68" y1="188" x2="120" y2="188"/>
    <line x1="120" y1="204" x2="68" y2="204"/>
    <line x1="376" y1="188" x2="428" y2="188"/>
    <line x1="428" y1="204" x2="376" y2="204"/>
    <line x1="596" y1="196" x2="540" y2="196"/>
  </g>
  <g fill="#BFC0C0">
    <polygon points="114,185 120,188 114,191"/>
    <polygon points="74,201 68,204 74,207"/>
    <polygon points="422,185 428,188 422,191"/>
    <polygon points="382,201 376,204 382,207"/>
    <polygon points="546,193 540,196 546,199"/>
  </g>

  <!-- left: client + server -->
  <circle cx="64" cy="196" r="4" fill="#4F5D75"/>
  <text class="t-small" x="64" y="224" text-anchor="middle">CLIENT</text>
  <rect x="120" y="168" width="112" height="56" rx="7" fill="#F5F5F5" stroke="#BFC0C0"/>
  <circle cx="134" cy="185" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="144" y="188">SERVER</text>
  <text class="t-desc" x="132" y="208">nothing new · 204</text>
  <text class="t-small" x="94" y="178" text-anchor="middle">EVERY 1 S</text>
  <text class="t-small" x="94" y="240" text-anchor="middle">EMPTY</text>

  <!-- right: client + server with a waiting slot + sender -->
  <circle cx="372" cy="196" r="4" fill="#4F5D75"/>
  <text class="t-small" x="372" y="224" text-anchor="middle">CLIENT</text>
  <rect x="428" y="168" width="112" height="56" rx="7" fill="#F5F5F5" stroke="#BFC0C0"/>
  <circle cx="442" cy="185" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="452" y="188">SERVER</text>
  <text class="t-desc" x="440" y="208">holds · replies</text>
  <rect x="508" y="176" width="24" height="20" rx="4" fill="none" stroke="#BFC0C0" stroke-dasharray="2 2"/>
  <circle cx="600" cy="196" r="4" fill="#4F5D75"/>
  <text class="t-small" x="600" y="224" text-anchor="middle">SENDER</text>

  <!-- held request: parked in the slot while the server waits (windows 'held' and 'held2') -->
  <circle cx="520" cy="186" r="4" fill="#B8915A" class="story" style="animation-name:held;opacity:0"/>
  <text class="t-tag story" x="520" y="164" text-anchor="middle" fill="#B8915A" style="animation-name:held;opacity:0">HELD</text>
  <circle cx="520" cy="186" r="4" fill="#B8915A" class="story" style="animation-name:held2;opacity:0"/>
  <text class="t-tag story" x="520" y="164" text-anchor="middle" fill="#B8915A" style="animation-name:held2;opacity:0">HELD</text>

  <text class="t-prose" x="330" y="316" text-anchor="middle">Same client, same server: the left pays a round trip every second for nothing; the right pays one per message.</text>

  <!-- @motion:elements -->
  <circle cx="376" cy="188" r="4" fill="#15803D" class="pkt" style="animation-name:p1"/>
  <circle cx="428" cy="188" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:p1-ring"/>
  <rect x="428" y="168" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:p1-glow"/>
  <g class="pkt" style="animation-name:p2">
    <circle cx="596" cy="196" r="4" fill="#15803D"/>
    <text class="t-tag" x="596" y="184" text-anchor="middle" fill="#15803D">MSG</text>
  </g>
  <circle cx="540" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:p2-ring"/>
  <rect x="428" y="168" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:p2-glow"/>
  <g class="pkt" style="animation-name:p3">
    <circle cx="428" cy="204" r="4" fill="#15803D"/>
    <text class="t-tag" x="428" y="218" text-anchor="middle" fill="#15803D">NEW</text>
  </g>
  <circle cx="376" cy="204" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:p3-ring"/>
  <circle cx="376" cy="188" r="4" fill="#15803D" class="pkt" style="animation-name:p4"/>
  <circle cx="428" cy="188" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:p4-ring"/>
  <rect x="428" y="168" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:p4-glow"/>
  <circle cx="68" cy="188" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1s;animation-delay:-0s"/>
  <circle cx="120" cy="204" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s2;animation-duration:1s;animation-delay:-0.5s"/>
  <!-- @/motion:elements -->

  <circle cx="36" cy="336" r="2.5" fill="#2E5AA8"/>
  <text class="t-name" x="46" y="340">POLL · EMPTY REPLY</text>
  <circle cx="196" cy="336" r="4" fill="#15803D"/>
  <text class="t-name" x="206" y="340">MESSAGE</text>
  <circle cx="316" cy="336" r="4" fill="#B8915A"/>
  <text class="t-name" x="326" y="340">HELD REQUEST</text>
</svg>
