<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" fill="none" role="img" aria-label="News feed fan-out on write: a user posts, the post service persists it and hands the id to the fanout service, which asks the graph database for friend ids, enqueues one message, and fanout workers write one feed-cache entry per friend while the queue drains continuously.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* m1: user publishes a post */
    @keyframes m1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      8.75% { transform: translate(52px, 0px); opacity: 1; }
      10.25%, 100% { transform: translate(52px, 0px); opacity: 0; }
    }
    @keyframes m1-glow { 0%, 8.75% { opacity: 0; } 9.75% { opacity: 0.3; } 13.75%, 100% { opacity: 0; } }
    /* m2: post id handed to fanout */
    @keyframes m2 {
      0%, 12.5% { transform: translate(0, 0); opacity: 0; }
      13.25% { opacity: 1; }
      17.5% { transform: translate(40px, 0px); opacity: 1; }
      19%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 17.5% { transform: scale(0.4); opacity: 0; } 18% { transform: scale(0.5); opacity: 0.8; } 23.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 17.5% { opacity: 0; } 18.5% { opacity: 0.3; } 22.5%, 100% { opacity: 0; } }
    /* m3: ask the graph db for friend ids */
    @keyframes m3 {
      0%, 21.25% { transform: translate(0, 0); opacity: 0; }
      22% { opacity: 1; }
      26.25% { transform: translate(40px, 0px); opacity: 1; }
      27.75%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 26.25% { transform: scale(0.4); opacity: 0; } 26.75% { transform: scale(0.5); opacity: 0.8; } 32.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 26.25% { opacity: 0; } 27.25% { opacity: 0.3; } 31.25%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 20% { opacity: 1; } 21.25%, 100% { opacity: 0; } }
    /* m4: friend ids come back after a lookup */
    @keyframes m4 {
      0%, 33.75% { transform: translate(0, 0); opacity: 0; }
      34.5% { opacity: 1; }
      38.75% { transform: translate(-40px, 0px); opacity: 1; }
      40.25%, 100% { transform: translate(-40px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 38.75% { transform: scale(0.4); opacity: 0; } 39.25% { transform: scale(0.5); opacity: 0.8; } 45%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 20% { opacity: 0; } 21.25%, 45% { opacity: 1; } 46.25%, 100% { opacity: 0; } }
    /* m5: one message enqueued */
    @keyframes m5 {
      0%, 42.5% { transform: translate(0, 0); opacity: 0; }
      43.25% { opacity: 1; }
      48.75% { transform: translate(0px, 48px); opacity: 1; }
      50.25%, 100% { transform: translate(0px, 48px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 48.75% { transform: scale(0.4); opacity: 0; } 49.25% { transform: scale(0.5); opacity: 0.8; } 55%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 48.75% { opacity: 0; } 49.75% { opacity: 0.3; } 53.75%, 100% { opacity: 0; } }
    /* m6a: worker writes alice's entry */
    @keyframes m6a {
      0%, 58.75% { transform: translate(0, 0); opacity: 0; }
      59.5% { opacity: 1; }
      67.5% { transform: translate(0px, 72px); opacity: 1; }
      69%, 100% { transform: translate(0px, 72px); opacity: 0; }
    }
    @keyframes m6a-ring { 0%, 67.5% { transform: scale(0.4); opacity: 0; } 68% { transform: scale(0.5); opacity: 0.8; } 73.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6a-glow { 0%, 67.5% { opacity: 0; } 68.5% { opacity: 0.3; } 72.5%, 100% { opacity: 0; } }
    /* m6b: …and bob's, at the same time */
    @keyframes m6b {
      0%, 58.75% { transform: translate(0, 0); opacity: 0; }
      59.5% { opacity: 1; }
      67.5% { transform: translate(0px, 72px); opacity: 1; }
      69%, 100% { transform: translate(0px, 72px); opacity: 0; }
    }
    @keyframes m6b-ring { 0%, 67.5% { transform: scale(0.4); opacity: 0; } 68% { transform: scale(0.5); opacity: 0.8; } 73.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6b-glow { 0%, 67.5% { opacity: 0; } 68.5% { opacity: 0.3; } 72.5%, 100% { opacity: 0; } }
    /* m6c: …and cara's */
    @keyframes m6c {
      0%, 58.75% { transform: translate(0, 0); opacity: 0; }
      59.5% { opacity: 1; }
      67.5% { transform: translate(0px, 72px); opacity: 1; }
      69%, 100% { transform: translate(0px, 72px); opacity: 0; }
    }
    @keyframes m6c-ring { 0%, 67.5% { transform: scale(0.4); opacity: 0; } 68% { transform: scale(0.5); opacity: 0.8; } 73.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6c-glow { 0%, 67.5% { opacity: 0; } 68.5% { opacity: 0.3; } 72.5%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 45% { opacity: 0; } 46.25%, 80% { opacity: 1; } 81.25%, 100% { opacity: 0; } }
    /* s1: workers never stop draining */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(40px, 0px); opacity: 1; }
      100% { transform: translate(40px, 0px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="459" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">NEWS FEED FAN-OUT</text>
  <text class="t-sub" x="28" y="66">One post becomes N feed entries at write time, so every friend's read is a cache hit.</text>

  <!-- connectors -->
  <g stroke="#363840" stroke-width="1">
    <line x1="44" y1="148" x2="96" y2="148"/>
    <line x1="208" y1="148" x2="248" y2="148"/>
    <line x1="360" y1="140" x2="400" y2="140"/>
    <line x1="400" y1="156" x2="360" y2="156"/>
    <line x1="304" y1="176" x2="304" y2="224"/>
    <line x1="360" y1="252" x2="400" y2="252" stroke-dasharray="3 3"/>
    <line x1="428" y1="280" x2="428" y2="352"/>
    <line x1="488" y1="280" x2="488" y2="352"/>
    <line x1="548" y1="280" x2="548" y2="352"/>
  </g>
  <g fill="#363840">
    <polygon points="90,145 96,148 90,151"/>
    <polygon points="242,145 248,148 242,151"/>
    <polygon points="394,137 400,140 394,143"/>
    <polygon points="366,153 360,156 366,159"/>
    <polygon points="301,218 304,224 307,218"/>
    <polygon points="425,346 428,352 431,346"/>
    <polygon points="485,346 488,352 491,346"/>
    <polygon points="545,346 548,352 551,346"/>
  </g>

  <!-- user -->
  <circle cx="40" cy="148" r="4" fill="#6F7987"/>
  <text class="t-small" x="40" y="172" text-anchor="middle">USER</text>

  <!-- post service -->
  <rect x="96" y="120" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="110" cy="137" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="120" y="140">POST SVC</text>
  <text class="t-desc" x="108" y="160">persist · post cache</text>

  <!-- fanout service -->
  <rect x="248" y="120" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="262" cy="137" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="272" y="140">FANOUT</text>
  <text class="t-desc" x="260" y="160">resolve · enqueue</text>

  <!-- graph db -->
  <rect x="400" y="120" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="414" cy="137" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="424" y="140">GRAPH DB</text>
  <text class="t-desc" x="412" y="160">friend edges</text>

  <!-- queue -->
  <rect x="248" y="224" width="112" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="262" cy="241" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.05s"/>
  <text class="t-name" x="272" y="244">QUEUE</text>
  <text class="t-desc" x="260" y="264">one message per post</text>

  <!-- workers -->
  <rect x="400" y="224" width="168" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="414" cy="241" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.4s"/>
  <text class="t-name" x="424" y="244">FANOUT WORKERS</text>
  <text class="t-desc" x="412" y="264">pull · write one entry per friend</text>

  <!-- feed cache with three friend tiles -->
  <rect x="396" y="328" width="184" height="64" rx="7" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-name" x="408" y="344">FEED CACHE</text>
  <rect x="404" y="352" width="48" height="20" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-small" x="428" y="366" text-anchor="middle">ALICE</text>
  <rect x="464" y="352" width="48" height="20" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-small" x="488" y="366" text-anchor="middle">BOB</text>
  <rect x="524" y="352" width="48" height="20" rx="6" fill="#141416" stroke="#363840"/>
  <text class="t-small" x="548" y="366" text-anchor="middle">CARA</text>

  <!-- connector labels -->
  <text class="t-small" x="380" y="132" text-anchor="middle">IDS</text>
  <text class="t-small" x="312" y="204">ENQUEUE</text>
  <text class="t-small" x="380" y="244" text-anchor="middle">DRAIN</text>
  <text class="t-small" x="556" y="316">WRITE ×N</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="420" text-anchor="middle">The expensive part happens once, at write time; the friend who opens the app just reads a pre-built list.</text>

  <!-- @motion:elements -->
  <circle cx="44" cy="148" r="4" fill="#4CF490" class="pkt" style="animation-name:m1"/>
  <rect x="96" y="120" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m1-glow"/>
  <circle cx="208" cy="148" r="4" fill="#4CF490" class="pkt" style="animation-name:m2"/>
  <circle cx="248" cy="148" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="248" y="120" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m2-glow"/>
  <circle cx="360" cy="140" r="4" fill="#4CF490" class="pkt" style="animation-name:m3"/>
  <circle cx="400" cy="140" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="400" y="120" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m3-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · POST</text>
  <circle cx="400" cy="156" r="4" fill="#4CF490" class="pkt" style="animation-name:m4"/>
  <circle cx="360" cy="156" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#FBDC8E" style="animation-name:ph2;opacity:0">2 · RESOLVE</text>
  <circle cx="304" cy="176" r="4" fill="#4CF490" class="pkt" style="animation-name:m5"/>
  <circle cx="304" cy="224" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="248" y="224" width="112" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m5-glow"/>
  <circle cx="428" cy="280" r="4" fill="#4CF490" class="pkt" style="animation-name:m6a"/>
  <circle cx="428" cy="352" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m6a-ring"/>
  <rect x="404" y="352" width="48" height="20" rx="6" fill="#4CF490" class="glow" style="animation-name:m6a-glow"/>
  <circle cx="488" cy="280" r="4" fill="#4CF490" class="pkt" style="animation-name:m6b"/>
  <circle cx="488" cy="352" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m6b-ring"/>
  <rect x="464" y="352" width="48" height="20" rx="6" fill="#4CF490" class="glow" style="animation-name:m6b-glow"/>
  <circle cx="548" cy="280" r="4" fill="#4CF490" class="pkt" style="animation-name:m6c"/>
  <circle cx="548" cy="352" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m6c-ring"/>
  <rect x="524" y="352" width="48" height="20" rx="6" fill="#4CF490" class="glow" style="animation-name:m6c-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · FAN OUT</text>
  <circle cx="360" cy="252" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.2s;animation-delay:-0s"/>
  <circle cx="360" cy="252" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.2s;animation-delay:-0.4s"/>
  <circle cx="360" cy="252" r="2.5" fill="#02BEFA" class="pkt" style="animation-name:s1;animation-duration:1.2s;animation-delay:-0.8s"/>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="436" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="440">ONE POST</text>
  <circle cx="176" cy="436" r="2.5" fill="#02BEFA"/>
  <text class="t-name" x="186" y="440">WORKERS DRAINING</text>
</svg>
