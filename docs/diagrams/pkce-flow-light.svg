<svg xmlns="http://www.w3.org/2000/svg" width="660" height="484" viewBox="0 0 660 484" fill="none" role="img" aria-label="OAuth 2.0 authorization code flow with PKCE: the app derives a verifier and its S256 challenge, sends the challenge to the authorization server, the user logs in and consents, code and state return to the app, the app checks the state and trades code plus verifier for tokens once the server confirms the hash matches, then calls the API with the bearer token.">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 12s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 12s; }
    /* n1: app derives verifier and challenge before anything is sent */
    @keyframes n1 { 0%, 0.83% { opacity: 0; } 1.67%, 95.83% { opacity: 1; } 96.67%, 100% { opacity: 0; } }
    /* m1: authorization request carries the challenge, never the verifier */
    @keyframes m1 {
      0%, 6.67% { transform: translate(0, 0); opacity: 0; }
      7.17% { opacity: 1; }
      10.83% { transform: translate(152px, 0px); opacity: 1; }
      11.83%, 100% { transform: translate(152px, 0px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 10.83% { transform: scale(0.4); opacity: 0; } 11.17% { transform: scale(0.5); opacity: 0.8; } 15%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 10.83% { opacity: 0; } 11.5% { opacity: 0.18; } 14.17%, 100% { opacity: 0; } }
    /* m2: auth server shows the login and consent page */
    @keyframes m2 {
      0%, 14.17% { transform: translate(0, 0); opacity: 0; }
      14.67% { opacity: 1; }
      21.67% { transform: translate(-296px, 0px); opacity: 1; }
      22.67%, 100% { transform: translate(-296px, 0px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 21.67% { transform: scale(0.4); opacity: 0; } 22% { transform: scale(0.5); opacity: 0.8; } 25.83%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 21.67% { opacity: 0; } 22.33% { opacity: 0.18; } 25%, 100% { opacity: 0; } }
    /* m3: user authenticates and consents */
    @keyframes m3 {
      0%, 28.33% { transform: translate(0, 0); opacity: 0; }
      28.83% { opacity: 1; }
      35.83% { transform: translate(296px, 0px); opacity: 1; }
      36.83%, 100% { transform: translate(296px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 35.83% { transform: scale(0.4); opacity: 0; } 36.17% { transform: scale(0.5); opacity: 0.8; } 40%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 35.83% { opacity: 0; } 36.5% { opacity: 0.18; } 39.17%, 100% { opacity: 0; } }
    /* m4: redirect back with the authorization code and the state */
    @keyframes m4 {
      0%, 39.17% { transform: translate(0, 0); opacity: 0; }
      39.67% { opacity: 1; }
      43.33% { transform: translate(-152px, 0px); opacity: 1; }
      44.33%, 100% { transform: translate(-152px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 43.33% { transform: scale(0.4); opacity: 0; } 43.67% { transform: scale(0.5); opacity: 0.8; } 47.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 43.33% { opacity: 0; } 44% { opacity: 0.18; } 46.67%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 44.17% { opacity: 1; } 45%, 100% { opacity: 0; } }
    /* n2: app checks the state it sent */
    @keyframes n2 { 0%, 44.17% { opacity: 0; } 45%, 95.83% { opacity: 1; } 96.67%, 100% { opacity: 0; } }
    /* m5: token request: code plus the original verifier */
    @keyframes m5 {
      0%, 48.33% { transform: translate(0, 0); opacity: 0; }
      48.83% { opacity: 1; }
      52.5% { transform: translate(152px, 0px); opacity: 1; }
      53.5%, 100% { transform: translate(152px, 0px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 52.5% { transform: scale(0.4); opacity: 0; } 52.83% { transform: scale(0.5); opacity: 0.8; } 56.67%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 52.5% { opacity: 0; } 53.17% { opacity: 0.18; } 55.83%, 100% { opacity: 0; } }
    /* n3: server hashes the verifier and compares with the stored challenge */
    @keyframes n3 { 0%, 53.33% { opacity: 0; } 54.17%, 95.83% { opacity: 1; } 96.67%, 100% { opacity: 0; } }
    /* m6: tokens issued only if the hash matches */
    @keyframes m6 {
      0%, 56.67% { transform: translate(0, 0); opacity: 0; }
      57.17% { opacity: 1; }
      60.83% { transform: translate(-152px, 0px); opacity: 1; }
      61.83%, 100% { transform: translate(-152px, 0px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 60.83% { transform: scale(0.4); opacity: 0; } 61.17% { transform: scale(0.5); opacity: 0.8; } 65%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 60.83% { opacity: 0; } 61.5% { opacity: 0.18; } 64.17%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 44.17% { opacity: 0; } 45%, 62.5% { opacity: 1; } 63.33%, 100% { opacity: 0; } }
    /* m7: api call with the bearer token */
    @keyframes m7 {
      0%, 64.17% { transform: translate(0, 0); opacity: 0; }
      64.67% { opacity: 1; }
      71.67% { transform: translate(304px, 0px); opacity: 1; }
      72.67%, 100% { transform: translate(304px, 0px); opacity: 0; }
    }
    @keyframes m7-ring { 0%, 71.67% { transform: scale(0.4); opacity: 0; } 72% { transform: scale(0.5); opacity: 0.8; } 75.83%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m7-glow { 0%, 71.67% { opacity: 0; } 72.33% { opacity: 0.18; } 75%, 100% { opacity: 0; } }
    /* m8: protected resource returned */
    @keyframes m8 {
      0%, 75% { transform: translate(0, 0); opacity: 0; }
      75.5% { opacity: 1; }
      82.5% { transform: translate(-304px, 0px); opacity: 1; }
      83.5%, 100% { transform: translate(-304px, 0px); opacity: 0; }
    }
    @keyframes m8-ring { 0%, 82.5% { transform: scale(0.4); opacity: 0; } 82.83% { transform: scale(0.5); opacity: 0.8; } 86.67%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m8-glow { 0%, 82.5% { opacity: 0; } 83.17% { opacity: 0.18; } 85.83%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 62.5% { opacity: 0; } 63.33%, 85% { opacity: 1; } 85.83%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="483" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">PKCE FLOW</text>
  <text class="t-sub" x="28" y="66">A public client proves it started the flow: the code is useless without the verifier only it holds.</text>

  <!-- lifelines -->
  <g stroke="#D9DADB" stroke-width="1" stroke-dasharray="4 4">
    <line x1="96" y1="152" x2="96" y2="412"/>
    <line x1="240" y1="152" x2="240" y2="412"/>
    <line x1="392" y1="152" x2="392" y2="412"/>
    <line x1="544" y1="152" x2="544" y2="412"/>
  </g>

  <!-- messages, top to bottom -->
  <g stroke="#BFC0C0" stroke-width="1">
    <line x1="240" y1="208" x2="392" y2="208"/>
    <line x1="392" y1="234" x2="96" y2="234"/>
    <line x1="96" y1="260" x2="392" y2="260"/>
    <line x1="392" y1="286" x2="240" y2="286"/>
    <line x1="240" y1="312" x2="392" y2="312"/>
    <line x1="392" y1="338" x2="240" y2="338"/>
    <line x1="240" y1="364" x2="544" y2="364"/>
    <line x1="544" y1="390" x2="240" y2="390"/>
  </g>
  <g fill="#BFC0C0">
    <polygon points="386,205 392,208 386,211"/>
    <polygon points="102,231 96,234 102,237"/>
    <polygon points="386,257 392,260 386,263"/>
    <polygon points="246,283 240,286 246,289"/>
    <polygon points="386,309 392,312 386,315"/>
    <polygon points="246,335 240,338 246,341"/>
    <polygon points="538,361 544,364 538,367"/>
    <polygon points="246,387 240,390 246,393"/>
  </g>

  <rect x="48" y="112" width="96" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="62" cy="125" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0s"/>
  <text class="t-name" x="72" y="128">USER</text>
  <text class="t-desc" x="60" y="144">browser</text>
  <rect x="192" y="112" width="96" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="206" cy="125" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="216" y="128">APP</text>
  <text class="t-desc" x="204" y="144">public client · no secret</text>
  <rect x="336" y="112" width="112" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="350" cy="125" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="360" y="128">AUTH SERVER</text>
  <text class="t-desc" x="348" y="144">authorize · token</text>
  <rect x="496" y="112" width="96" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="510" cy="125" r="2.5" fill="#15803D" class="tick" style="animation-delay:-1.05s"/>
  <text class="t-name" x="520" y="128">API</text>
  <text class="t-desc" x="508" y="144">resource server</text>

  <text class="t-small" x="316" y="202" text-anchor="middle">/AUTHORIZE + CHALLENGE + STATE</text>
  <text class="t-small" x="244" y="228" text-anchor="middle">LOGIN + CONSENT PAGE</text>
  <text class="t-small" x="244" y="254" text-anchor="middle">CREDENTIALS + CONSENT</text>
  <text class="t-small" x="316" y="280" text-anchor="middle">302 · CODE + STATE</text>
  <text class="t-small" x="316" y="306" text-anchor="middle">/TOKEN + CODE + VERIFIER</text>
  <text class="t-small" x="316" y="332" text-anchor="middle">ACCESS + REFRESH TOKEN</text>
  <text class="t-small" x="392" y="358" text-anchor="middle">GET /API · BEARER TOKEN</text>
  <text class="t-small" x="392" y="384" text-anchor="middle">200 · RESOURCE</text>

  <!-- computations beside the lifelines (windows n1, n2, n3) -->
  <text class="t-tag story" x="248" y="168" fill="#B8915A" style="animation-name:n1;opacity:0">VERIFIER ← RANDOM(43–128 CHARS)</text>
  <text class="t-tag story" x="248" y="180" fill="#B8915A" style="animation-name:n1;opacity:0">CHALLENGE ← B64URL(SHA256(VERIFIER))</text>
  <text class="t-tag story" x="232" y="304" text-anchor="end" fill="#B8915A" style="animation-name:n2;opacity:0">STATE MATCHES · OK</text>
  <text class="t-tag story" x="400" y="330" fill="#B8915A" style="animation-name:n3;opacity:0">SHA256(VERIFIER) = CHALLENGE · OK</text>

  <text class="t-prose" x="330" y="436" text-anchor="middle">An intercepted code fails at /token: the attacker never saw the verifier, and the server compares its hash to the challenge it stored.</text>

  <!-- @motion:elements -->
  <circle cx="240" cy="208" r="4" fill="#15803D" class="pkt" style="animation-name:m1"/>
  <circle cx="392" cy="208" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="336" y="112" width="112" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m1-glow"/>
  <circle cx="392" cy="234" r="4" fill="#15803D" class="pkt" style="animation-name:m2"/>
  <circle cx="96" cy="234" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="48" y="112" width="96" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m2-glow"/>
  <circle cx="96" cy="260" r="4" fill="#15803D" class="pkt" style="animation-name:m3"/>
  <circle cx="392" cy="260" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="336" y="112" width="112" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m3-glow"/>
  <circle cx="392" cy="286" r="4" fill="#15803D" class="pkt" style="animation-name:m4"/>
  <circle cx="240" cy="286" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="192" y="112" width="96" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m4-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph1;opacity:0">1 · AUTHORIZE</text>
  <circle cx="240" cy="312" r="4" fill="#15803D" class="pkt" style="animation-name:m5"/>
  <circle cx="392" cy="312" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="336" y="112" width="112" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m5-glow"/>
  <circle cx="392" cy="338" r="4" fill="#15803D" class="pkt" style="animation-name:m6"/>
  <circle cx="240" cy="338" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <rect x="192" y="112" width="96" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m6-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#B8915A" style="animation-name:ph2;opacity:0">2 · EXCHANGE</text>
  <circle cx="240" cy="364" r="4" fill="#15803D" class="pkt" style="animation-name:m7"/>
  <circle cx="544" cy="364" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m7-ring"/>
  <rect x="496" y="112" width="96" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m7-glow"/>
  <circle cx="544" cy="390" r="4" fill="#15803D" class="pkt" style="animation-name:m8"/>
  <circle cx="240" cy="390" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:m8-ring"/>
  <rect x="192" y="112" width="96" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:m8-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph3;opacity:0">3 · CALL API</text>
  <!-- @/motion:elements -->

  <circle cx="36" cy="460" r="4" fill="#15803D"/>
  <text class="t-name" x="46" y="464">MESSAGE</text>
  <circle cx="176" cy="460" r="4" fill="#B8915A"/>
  <text class="t-name" x="186" y="464">LOCAL COMPUTATION</text>
</svg>
