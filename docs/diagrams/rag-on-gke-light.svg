<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" fill="none" role="img" aria-label="RAG-capable app on GKE: a user prompt passes Identity-Aware Proxy to the frontend, which runs a semantic search in Cloud SQL with pgvector, gets the nearest chunks back, sends the contextualized prompt to the TGI inference server, receives the answer and returns it through the proxy, while a Ray job keeps embedding raw documents from the bucket into Cloud SQL.">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* q1: prompt reaches identity-aware proxy */
    @keyframes q1 {
      0%, 2% { transform: translate(0, 0); opacity: 0; }
      2.6% { opacity: 1; }
      6% { transform: translate(68px, 0px); opacity: 1; }
      7.2%, 100% { transform: translate(68px, 0px); opacity: 0; }
    }
    @keyframes q1-glow { 0%, 6% { opacity: 0; } 6.8% { opacity: 0.18; } 10%, 100% { opacity: 0; } }
    /* q2: authenticated request to the frontend */
    @keyframes q2 {
      0%, 9% { transform: translate(0, 0); opacity: 0; }
      9.6% { opacity: 1; }
      12% { transform: translate(40px, 0px); opacity: 1; }
      13.2%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes q2-ring { 0%, 12% { transform: scale(0.4); opacity: 0; } 12.4% { transform: scale(0.5); opacity: 0.8; } 17%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q2-glow { 0%, 12% { opacity: 0; } 12.8% { opacity: 0.18; } 16%, 100% { opacity: 0; } }
    /* q3: semantic search in pgvector */
    @keyframes q3 {
      0%, 15% { transform: translate(0, 0); opacity: 0; }
      15.6% { opacity: 1; }
      19% { transform: translate(56px, 0px); opacity: 1; }
      20.2%, 100% { transform: translate(56px, 0px); opacity: 0; }
    }
    @keyframes q3-ring { 0%, 19% { transform: scale(0.4); opacity: 0; } 19.4% { transform: scale(0.5); opacity: 0.8; } 24%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q3-glow { 0%, 19% { opacity: 0; } 19.8% { opacity: 0.18; } 23%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 28% { opacity: 1; } 29%, 100% { opacity: 0; } }
    /* q4: nearest chunks come back */
    @keyframes q4 {
      0%, 24% { transform: translate(0, 0); opacity: 0; }
      24.6% { opacity: 1; }
      28% { transform: translate(-56px, 0px); opacity: 1; }
      29.2%, 100% { transform: translate(-56px, 0px); opacity: 0; }
    }
    @keyframes q4-ring { 0%, 28% { transform: scale(0.4); opacity: 0; } 28.4% { transform: scale(0.5); opacity: 0.8; } 33%, 100% { transform: scale(1.4); opacity: 0; } }
    /* q5: contextualized prompt to the inference server */
    @keyframes q5 {
      0%, 31% { transform: translate(0, 0); opacity: 0; }
      31.6% { opacity: 1; }
      35% { transform: translate(0px, 48px); opacity: 1; }
      36.2%, 100% { transform: translate(0px, 48px); opacity: 0; }
    }
    @keyframes q5-ring { 0%, 35% { transform: scale(0.4); opacity: 0; } 35.4% { transform: scale(0.5); opacity: 0.8; } 40%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q5-glow { 0%, 35% { opacity: 0; } 35.8% { opacity: 0.18; } 39%, 100% { opacity: 0; } }
    /* ph2: act 2: the model generates */
    @keyframes ph2 { 0%, 28% { opacity: 0; } 29%, 56% { opacity: 1; } 57%, 100% { opacity: 0; } }
    /* q6: answer after generation */
    @keyframes q6 {
      0%, 47% { transform: translate(0, 0); opacity: 0; }
      47.6% { opacity: 1; }
      51% { transform: translate(0px, -48px); opacity: 1; }
      52.2%, 100% { transform: translate(0px, -48px); opacity: 0; }
    }
    @keyframes q6-ring { 0%, 51% { transform: scale(0.4); opacity: 0; } 51.4% { transform: scale(0.5); opacity: 0.8; } 56%, 100% { transform: scale(1.4); opacity: 0; } }
    /* q7: response returns through the proxy */
    @keyframes q7 {
      0%, 54% { transform: translate(0, 0); opacity: 0; }
      54.6% { opacity: 1; }
      54.72% { transform: translate(0px, -16px); }
      64.39% { transform: translate(-216px, -16px); }
      66% { transform: translate(-216px, 20px); opacity: 1; }
      67.2%, 100% { transform: translate(-216px, 20px); opacity: 0; }
    }
    @keyframes q7-ring { 0%, 66% { transform: scale(0.4); opacity: 0; } 66.4% { transform: scale(0.5); opacity: 0.8; } 71%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 56% { opacity: 0; } 57%, 76% { opacity: 1; } 77%, 100% { opacity: 0; } }
    /* s1: raw docs pulled into the ray job */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(-24px, 0px); opacity: 1; }
      100% { transform: translate(-24px, 0px); opacity: 0; }
    }
    /* s2: embeddings stored in cloud sql */
    @keyframes s2 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(0px, -48px); opacity: 1; }
      100% { transform: translate(0px, -48px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="439" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">RAG ON GKE</text>
  <text class="t-sub" x="28" y="66">Retrieval runs before generation; the model only ever sees a prompt already stuffed with the nearest chunks.</text>

  <!-- subsystems -->
  <rect x="96" y="96" width="272" height="232" rx="12" fill="none" stroke="#BFC0C0" stroke-dasharray="4 4"/>
  <text class="t-zone" x="112" y="118">SERVING</text>
  <rect x="384" y="96" width="248" height="232" rx="12" fill="none" stroke="#BFC0C0" stroke-dasharray="4 4"/>
  <text class="t-zone" x="400" y="118">EMBEDDING · RAG</text>

  <g stroke="#BFC0C0" stroke-width="1">
    <line x1="44" y1="180" x2="112" y2="180"/>
    <line x1="192" y1="180" x2="232" y2="180"/>
    <line x1="344" y1="172" x2="400" y2="172"/>
    <line x1="400" y1="188" x2="344" y2="188"/>
    <line x1="272" y1="208" x2="272" y2="256"/>
    <line x1="304" y1="256" x2="304" y2="208"/>
    <path d="M256,152 V144 Q256,136 248,136 H48 Q40,136 40,144 V172"/>
    <line x1="536" y1="284" x2="512" y2="284" stroke-dasharray="3 3"/>
    <line x1="456" y1="256" x2="456" y2="208" stroke-dasharray="3 3"/>
  </g>
  <g fill="#BFC0C0">
    <polygon points="106,177 112,180 106,183"/>
    <polygon points="226,177 232,180 226,183"/>
    <polygon points="394,169 400,172 394,175"/>
    <polygon points="350,185 344,188 350,191"/>
    <polygon points="269,250 272,256 275,250"/>
    <polygon points="301,214 304,208 307,214"/>
    <polygon points="37,166 40,172 43,166"/>
    <polygon points="518,281 512,284 518,287"/>
    <polygon points="453,214 456,208 459,214"/>
  </g>

  <circle cx="40" cy="180" r="4" fill="#4F5D75"/>
  <text class="t-small" x="40" y="204" text-anchor="middle">USER</text>

  <rect x="112" y="152" width="80" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="126" cy="169" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0s"/>
  <text class="t-name" x="136" y="172">IAP</text>
  <text class="t-desc" x="124" y="192">identity proxy</text>
  <rect x="232" y="152" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="246" cy="169" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="256" y="172">FRONTEND</text>
  <text class="t-desc" x="244" y="192">chat · builds prompt</text>
  <rect x="400" y="152" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="414" cy="169" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="424" y="172">CLOUD SQL</text>
  <text class="t-desc" x="412" y="192">pgvector · HA</text>
  <rect x="232" y="256" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="246" cy="273" r="2.5" fill="#15803D" class="tick" style="animation-delay:-1.05s"/>
  <text class="t-name" x="256" y="276">INFERENCE</text>
  <text class="t-desc" x="244" y="296">TGI · open LLM</text>
  <rect x="400" y="256" width="112" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="414" cy="273" r="2.5" fill="#15803D" class="tick" style="animation-delay:-1.4s"/>
  <text class="t-name" x="424" y="276">RAY JOB</text>
  <text class="t-desc" x="412" y="296">chunk · embed</text>
  <rect x="536" y="256" width="80" height="56" rx="7" fill="#F5F5F5" stroke="#BFC0C0"/>
  <text class="t-name" x="548" y="276">BUCKET</text>
  <text class="t-desc" x="548" y="296">raw docs</text>

  <text class="t-small" x="372" y="164" text-anchor="middle">SEARCH</text>
  <text class="t-small" x="264" y="236" text-anchor="end">PROMPT</text>
  <text class="t-small" x="464" y="236">EMBED</text>

  <text class="t-prose" x="330" y="384" text-anchor="middle">Two clocks: the serving path answers one prompt; the embedding job keeps the vector store fresh regardless of traffic.</text>

  <!-- @motion:elements -->
  <circle cx="44" cy="180" r="4" fill="#15803D" class="pkt" style="animation-name:q1"/>
  <rect x="112" y="152" width="80" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:q1-glow"/>
  <circle cx="192" cy="180" r="4" fill="#15803D" class="pkt" style="animation-name:q2"/>
  <circle cx="232" cy="180" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:q2-ring"/>
  <rect x="232" y="152" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:q2-glow"/>
  <circle cx="344" cy="172" r="4" fill="#15803D" class="pkt" style="animation-name:q3"/>
  <circle cx="400" cy="172" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:q3-ring"/>
  <rect x="400" y="152" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:q3-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph1;opacity:0">1 · RETRIEVE</text>
  <g class="pkt" style="animation-name:q4">
    <circle cx="400" cy="188" r="4" fill="#15803D"/>
    <text class="t-tag" x="400" y="202" text-anchor="middle" fill="#15803D">CHUNKS</text>
  </g>
  <circle cx="344" cy="188" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:q4-ring"/>
  <circle cx="272" cy="208" r="4" fill="#15803D" class="pkt" style="animation-name:q5"/>
  <circle cx="272" cy="256" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:q5-ring"/>
  <rect x="232" y="256" width="112" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:q5-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#B8915A" style="animation-name:ph2;opacity:0">2 · GENERATE</text>
  <g class="pkt" style="animation-name:q6">
    <circle cx="304" cy="256" r="4" fill="#15803D"/>
    <text class="t-tag" x="304" y="242" text-anchor="middle" fill="#15803D">ANSWER</text>
  </g>
  <circle cx="304" cy="208" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:q6-ring"/>
  <circle cx="256" cy="152" r="4" fill="#15803D" class="pkt" style="animation-name:q7"/>
  <circle cx="40" cy="172" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:q7-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph3;opacity:0">3 · RESPOND</text>
  <circle cx="536" cy="284" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-0s"/>
  <circle cx="536" cy="284" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s1;animation-duration:1.6s;animation-delay:-0.8s"/>
  <circle cx="456" cy="256" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s2;animation-duration:1.6s;animation-delay:-0.8s"/>
  <circle cx="456" cy="256" r="2.5" fill="#2E5AA8" class="pkt" style="animation-name:s2;animation-duration:1.6s;animation-delay:-1.6s"/>
  <!-- @/motion:elements -->

  <circle cx="36" cy="416" r="4" fill="#15803D"/>
  <text class="t-name" x="46" y="420">ONE PROMPT</text>
  <circle cx="176" cy="416" r="2.5" fill="#2E5AA8"/>
  <text class="t-name" x="186" y="420">EMBEDDING PIPELINE</text>
</svg>
