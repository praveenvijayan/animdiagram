<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" fill="none" role="img" aria-label="RAG app on GKE, all components: users pass Identity-Aware Proxy to the frontend and its chat interface, which searches Cloud SQL pgvector and checks Responsible AI in parallel, sends the stuffed prompt to the TGI inference server and returns the answer. Meanwhile internal and external sources fill the bucket, a Ray job embeds them into Cloud SQL, and inference streams logs, metrics and analytics.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* q1: prompt reaches identity-aware proxy */
    @keyframes q1 {
      0%, 2% { transform: translate(0, 0); opacity: 0; }
      2.6% { opacity: 1; }
      6% { transform: translate(68px, 0px); opacity: 1; }
      7.2%, 100% { transform: translate(68px, 0px); opacity: 0; }
    }
    @keyframes q1-glow { 0%, 6% { opacity: 0; } 6.8% { opacity: 0.3; } 10%, 100% { opacity: 0; } }
    /* q2: authenticated request to the frontend's chat interface */
    @keyframes q2 {
      0%, 9% { transform: translate(0, 0); opacity: 0; }
      9.6% { opacity: 1; }
      12% { transform: translate(40px, 0px); opacity: 1; }
      13.2%, 100% { transform: translate(40px, 0px); opacity: 0; }
    }
    @keyframes q2-ring { 0%, 12% { transform: scale(0.4); opacity: 0; } 12.4% { transform: scale(0.5); opacity: 0.8; } 17%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q2-glow { 0%, 12% { opacity: 0; } 12.8% { opacity: 0.3; } 16%, 100% { opacity: 0; } }
    /* q3: semantic search in pgvector */
    @keyframes q3 {
      0%, 15% { transform: translate(0, 0); opacity: 0; }
      15.6% { opacity: 1; }
      19% { transform: translate(56px, 0px); opacity: 1; }
      20.2%, 100% { transform: translate(56px, 0px); opacity: 0; }
    }
    @keyframes q3-ring { 0%, 19% { transform: scale(0.4); opacity: 0; } 19.4% { transform: scale(0.5); opacity: 0.8; } 24%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q3-glow { 0%, 19% { opacity: 0; } 19.8% { opacity: 0.3; } 23%, 100% { opacity: 0; } }
    /* q3b: responsible ai check runs in parallel */
    @keyframes q3b {
      0%, 15% { transform: translate(0, 0); opacity: 0; }
      15.6% { opacity: 1; }
      17.2% { transform: translate(0px, 44px); }
      20% { transform: translate(-56px, 44px); opacity: 1; }
      21.2%, 100% { transform: translate(-56px, 44px); opacity: 0; }
    }
    @keyframes q3b-ring { 0%, 20% { transform: scale(0.4); opacity: 0; } 20.4% { transform: scale(0.5); opacity: 0.8; } 25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q3b-glow { 0%, 20% { opacity: 0; } 20.8% { opacity: 0.3; } 24%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 28% { opacity: 1; } 29%, 100% { opacity: 0; } }
    /* q4: nearest chunks come back */
    @keyframes q4 {
      0%, 24% { transform: translate(0, 0); opacity: 0; }
      24.6% { opacity: 1; }
      28% { transform: translate(-56px, 0px); opacity: 1; }
      29.2%, 100% { transform: translate(-56px, 0px); opacity: 0; }
    }
    @keyframes q4-ring { 0%, 28% { transform: scale(0.4); opacity: 0; } 28.4% { transform: scale(0.5); opacity: 0.8; } 33%, 100% { transform: scale(1.4); opacity: 0; } }
    /* q5: contextualized prompt to the inference server */
    @keyframes q5 {
      0%, 31% { transform: translate(0, 0); opacity: 0; }
      31.6% { opacity: 1; }
      35% { transform: translate(0px, 32px); opacity: 1; }
      36.2%, 100% { transform: translate(0px, 32px); opacity: 0; }
    }
    @keyframes q5-ring { 0%, 35% { transform: scale(0.4); opacity: 0; } 35.4% { transform: scale(0.5); opacity: 0.8; } 40%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes q5-glow { 0%, 35% { opacity: 0; } 35.8% { opacity: 0.3; } 39%, 100% { opacity: 0; } }
    /* ph2: act 2: the model generates */
    @keyframes ph2 { 0%, 28% { opacity: 0; } 29%, 56% { opacity: 1; } 57%, 100% { opacity: 0; } }
    /* q6: answer after generation */
    @keyframes q6 {
      0%, 47% { transform: translate(0, 0); opacity: 0; }
      47.6% { opacity: 1; }
      51% { transform: translate(0px, -32px); opacity: 1; }
      52.2%, 100% { transform: translate(0px, -32px); opacity: 0; }
    }
    @keyframes q6-ring { 0%, 51% { transform: scale(0.4); opacity: 0; } 51.4% { transform: scale(0.5); opacity: 0.8; } 56%, 100% { transform: scale(1.4); opacity: 0; } }
    /* q7: response returns through the proxy */
    @keyframes q7 {
      0%, 54% { transform: translate(0, 0); opacity: 0; }
      54.6% { opacity: 1; }
      54.72% { transform: translate(0px, -16px); }
      64.39% { transform: translate(-216px, -16px); }
      66% { transform: translate(-216px, 20px); opacity: 1; }
      67.2%, 100% { transform: translate(-216px, 20px); opacity: 0; }
    }
    @keyframes q7-ring { 0%, 66% { transform: scale(0.4); opacity: 0; } 66.4% { transform: scale(0.5); opacity: 0.8; } 71%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 56% { opacity: 0; } 57%, 76% { opacity: 1; } 77%, 100% { opacity: 0; } }
    /* s1: internal and external sources land raw data in the bucket */
    @keyframes s1 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      28% { transform: translate(0px, -16px); }
      64% { transform: translate(36px, -16px); }
      88% { transform: translate(36px, -40px); opacity: 1; }
      100% { transform: translate(36px, -40px); opacity: 0; }
    }
    /* s2: ray job reads the bucket over the fuse csi driver */
    @keyframes s2 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(-24px, 0px); opacity: 1; }
      100% { transform: translate(-24px, 0px); opacity: 0; }
    }
    /* s3: embeddings stored in cloud sql */
    @keyframes s3 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(0px, -24px); opacity: 1; }
      100% { transform: translate(0px, -24px); opacity: 0; }
    }
    /* s4: inference server streams logs, metrics and analytics */
    @keyframes s4 {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      88% { transform: translate(0px, 40px); opacity: 1; }
      100% { transform: translate(0px, 40px); opacity: 0; }
    }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="479" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">RAG ON GKE</text>
  <text class="t-sub" x="28" y="66">Retrieval runs before generation; the model only ever sees a prompt already stuffed with the nearest chunks.</text>

