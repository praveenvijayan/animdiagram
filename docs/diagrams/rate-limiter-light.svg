<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360" fill="none" role="img" aria-label="Rate limiter middleware: a client request is counted in Redis and forwarded to the API servers while the window has room; a later request pushes the counter over the limit and the limiter answers 429 itself, so the API servers never see it.">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* r1: first request reaches the limiter */
    @keyframes r1 {
      0%, 2% { transform: translate(0, 0); opacity: 0; }
      2.6% { opacity: 1; }
      6% { transform: translate(68px, 0px); opacity: 1; }
      7.2%, 100% { transform: translate(68px, 0px); opacity: 0; }
    }
    @keyframes r1-glow { 0%, 6% { opacity: 0; } 6.8% { opacity: 0.18; } 10%, 100% { opacity: 0; } }
    /* r2: increment the client's counter */
    @keyframes r2 {
      0%, 9% { transform: translate(0, 0); opacity: 0; }
      9.6% { opacity: 1; }
      12% { transform: translate(0px, 48px); opacity: 1; }
      13.2%, 100% { transform: translate(0px, 48px); opacity: 0; }
    }
    @keyframes r2-ring { 0%, 12% { transform: scale(0.4); opacity: 0; } 12.4% { transform: scale(0.5); opacity: 0.8; } 17%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes r2-glow { 0%, 12% { opacity: 0; } 12.8% { opacity: 0.18; } 16%, 100% { opacity: 0; } }
    /* b1: window usage: 2/5 idle, 3/5 after r2, full after r6 */
    @keyframes b1 { 0%, 11% { transform: scaleX(0.4); } 12%, 55% { transform: scaleX(0.6); } 56%, 96% { transform: scaleX(1); } 100% { transform: scaleX(0.4); } }
    /* r3: count comes back under the limit */
    @keyframes r3 {
      0%, 15% { transform: translate(0, 0); opacity: 0; }
      15.6% { opacity: 1; }
      18% { transform: translate(0px, -48px); opacity: 1; }
      19.2%, 100% { transform: translate(0px, -48px); opacity: 0; }
    }
    @keyframes r3-ring { 0%, 18% { transform: scale(0.4); opacity: 0; } 18.4% { transform: scale(0.5); opacity: 0.8; } 23%, 100% { transform: scale(1.4); opacity: 0; } }
    /* r4: forwarded to the api servers */
    @keyframes r4 {
      0%, 21% { transform: translate(0, 0); opacity: 0; }
      21.6% { opacity: 1; }
      31% { transform: translate(224px, 0px); opacity: 1; }
      32.2%, 100% { transform: translate(224px, 0px); opacity: 0; }
    }
    @keyframes r4-ring { 0%, 31% { transform: scale(0.4); opacity: 0; } 31.4% { transform: scale(0.5); opacity: 0.8; } 36%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes r4-glow { 0%, 31% { opacity: 0; } 31.8% { opacity: 0.18; } 35%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 34% { opacity: 1; } 35%, 100% { opacity: 0; } }
    /* r5: a later request in the same window */
    @keyframes r5 {
      0%, 46% { transform: translate(0, 0); opacity: 0; }
      46.6% { opacity: 1; }
      50% { transform: translate(68px, 0px); opacity: 1; }
      51.2%, 100% { transform: translate(68px, 0px); opacity: 0; }
    }
    @keyframes r5-glow { 0%, 50% { opacity: 0; } 50.8% { opacity: 0.18; } 54%, 100% { opacity: 0; } }
    /* r6: increment again */
    @keyframes r6 {
      0%, 53% { transform: translate(0, 0); opacity: 0; }
      53.6% { opacity: 1; }
      56% { transform: translate(0px, 48px); opacity: 1; }
      57.2%, 100% { transform: translate(0px, 48px); opacity: 0; }
    }
    @keyframes r6-ring { 0%, 56% { transform: scale(0.4); opacity: 0; } 56.4% { transform: scale(0.5); opacity: 0.8; } 61%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes r6-glow { 0%, 56% { opacity: 0; } 56.8% { opacity: 0.18; } 60%, 100% { opacity: 0; } }
    /* r7: count comes back over the limit */
    @keyframes r7 {
      0%, 59% { transform: translate(0, 0); opacity: 0; }
      59.6% { opacity: 1; }
      62% { transform: translate(0px, -48px); opacity: 1; }
      63.2%, 100% { transform: translate(0px, -48px); opacity: 0; }
    }
    @keyframes r7-ring { 0%, 62% { transform: scale(0.4); opacity: 0; } 62.4% { transform: scale(0.5); opacity: 0.8; } 67%, 100% { transform: scale(1.4); opacity: 0; } }
    /* r8: 429 goes straight back to the client */
    @keyframes r8 {
      0%, 65% { transform: translate(0, 0); opacity: 0; }
      65.6% { opacity: 1; }
      66.18% { transform: translate(0px, -24px); }
      72.84% { transform: translate(-136px, -24px); }
      75% { transform: translate(-136px, 20px); opacity: 1; }
      76.2%, 100% { transform: translate(-136px, 20px); opacity: 0; }
    }
    @keyframes r8-ring { 0%, 75% { transform: scale(0.4); opacity: 0; } 75.4% { transform: scale(0.5); opacity: 0.8; } 80%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 44% { opacity: 0; } 45%, 78% { opacity: 1; } 79%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="359" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">RATE LIMITER</text>
  <text class="t-sub" x="28" y="66">Over the limit, the middleware answers 429 itself; the API servers only ever see the allowed share.</text>

  <!-- connectors -->
  <g stroke="#BFC0C0" stroke-width="1">
    <line x1="44" y1="148" x2="112" y2="148"/>
    <path d="M176,120 V104 Q176,96 168,96 H48 Q40,96 40,104 V140"/>
    <line x1="240" y1="148" x2="464" y2="148"/>
    <line x1="160" y1="176" x2="160" y2="224"/>
    <line x1="192" y1="224" x2="192" y2="176"/>
  </g>
  <g fill="#BFC0C0">
    <polygon points="106,145 112,148 106,151"/>
    <polygon points="37,134 40,140 43,134"/>
    <polygon points="458,145 464,148 458,151"/>
    <polygon points="157,218 160,224 163,218"/>
    <polygon points="189,182 192,176 195,182"/>
  </g>

  <!-- client -->
  <circle cx="40" cy="148" r="4" fill="#4F5D75"/>
  <text class="t-small" x="40" y="172" text-anchor="middle">CLIENT</text>

  <!-- limiter -->
  <rect x="112" y="120" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="126" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="136" y="140">LIMITER</text>
  <text class="t-desc" x="124" y="160">middleware · 5 req / window</text>

  <!-- redis -->
  <rect x="112" y="224" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="126" cy="241" r="2.5" fill="#15803D" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="136" y="244">REDIS</text>
  <rect x="124" y="252" width="104" height="4" rx="2" fill="#D9DADB"/>
  <text class="t-desc" x="124" y="270">counter per client · window</text>

  <!-- api servers -->
  <rect x="464" y="120" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <circle cx="478" cy="137" r="2.5" fill="#15803D" class="tick" style="animation-delay:-1.4s"/>
  <text class="t-name" x="488" y="140">API SERVERS</text>
  <text class="t-desc" x="476" y="160">see only allowed traffic</text>

  <!-- connector labels -->
  <text class="t-small" x="352" y="140" text-anchor="middle">ALLOWED</text>
  <text class="t-small" x="152" y="204" text-anchor="end">INCR</text>
  <text class="t-small" x="200" y="204">COUNT</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="312" text-anchor="middle">Two requests, one window: the first is counted and passed; the second overflows the counter and is refused at the edge.</text>

  <!-- @motion:elements -->
  <circle cx="44" cy="148" r="4" fill="#15803D" class="pkt" style="animation-name:r1"/>
  <rect x="112" y="120" width="128" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:r1-glow"/>
  <circle cx="160" cy="176" r="4" fill="#15803D" class="pkt" style="animation-name:r2"/>
  <circle cx="160" cy="224" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:r2-ring"/>
  <rect x="112" y="224" width="128" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:r2-glow"/>
  <rect x="124" y="252" width="104" height="4" rx="2" fill="#15803D" fill-opacity="0.6" class="bar" style="animation-name:b1"/>
  <g class="pkt" style="animation-name:r3">
    <circle cx="192" cy="224" r="4" fill="#15803D"/>
    <text class="t-tag" x="192" y="212" text-anchor="middle" fill="#15803D">3/5</text>
  </g>
  <circle cx="192" cy="176" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:r3-ring"/>
  <circle cx="240" cy="148" r="4" fill="#15803D" class="pkt" style="animation-name:r4"/>
  <circle cx="464" cy="148" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:r4-ring"/>
  <rect x="464" y="120" width="128" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:r4-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph1;opacity:0">1 · ALLOW</text>
  <circle cx="44" cy="148" r="4" fill="#15803D" class="pkt" style="animation-name:r5"/>
  <rect x="112" y="120" width="128" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:r5-glow"/>
  <circle cx="160" cy="176" r="4" fill="#15803D" class="pkt" style="animation-name:r6"/>
  <circle cx="160" cy="224" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:r6-ring"/>
  <rect x="112" y="224" width="128" height="56" rx="6" fill="#15803D" class="glow" style="animation-name:r6-glow"/>
  <g class="pkt" style="animation-name:r7">
    <circle cx="192" cy="224" r="4" fill="#B8915A"/>
    <text class="t-tag" x="192" y="212" text-anchor="middle" fill="#B8915A">6/5</text>
  </g>
  <circle cx="192" cy="176" r="10" fill="none" stroke="#B8915A" stroke-width="1.5" class="ring" style="animation-name:r7-ring"/>
  <g class="pkt" style="animation-name:r8">
    <circle cx="176" cy="120" r="4" fill="#9C6B50"/>
    <text class="t-tag" x="176" y="108" text-anchor="middle" fill="#9C6B50">429</text>
  </g>
  <circle cx="40" cy="140" r="10" fill="none" stroke="#9C6B50" stroke-width="1.5" class="ring" style="animation-name:r8-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#9C6B50" style="animation-name:ph2;opacity:0">2 · REFUSE</text>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="336" r="4" fill="#15803D"/>
  <text class="t-name" x="46" y="340">REQUEST</text>
  <circle cx="176" cy="336" r="4" fill="#B8915A"/>
  <text class="t-name" x="186" y="340">OVER LIMIT</text>
  <circle cx="316" cy="336" r="4" fill="#9C6B50"/>
  <text class="t-name" x="326" y="340">429 REFUSED</text>
</svg>
