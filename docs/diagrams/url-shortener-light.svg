<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" fill="none" role="img" aria-label="URL shortener flowchart: a long URL comes in, the database lookup finds nothing, the hash function makes a short URL, it collides with an existing one, the URL is re-salted and hashed again, the second hash is unique, it is saved and the flow ends; the branch that returns an existing short URL is drawn but not taken.">
  <style>
    /* ---- type ramp (light skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #2D3142; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #4F5D75; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #4F5D75; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #3B4054; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #4F5D75; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #4F5D75; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #4F5D75; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #6E6479; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* f1: long url goes to the lookup */
    @keyframes f1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      7.5% { transform: translate(28px, 0px); opacity: 1; }
      9%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes f1-ring { 0%, 7.5% { transform: scale(0.4); opacity: 0; } 8% { transform: scale(0.5); opacity: 0.8; } 13.75%, 100% { transform: scale(1.4); opacity: 0; } }
    /* f2: not in the db: hash it */
    @keyframes f2 {
      0%, 11.25% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      15% { transform: translate(28px, 0px); opacity: 1; }
      16.5%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes f2-ring { 0%, 15% { transform: scale(0.4); opacity: 0; } 15.5% { transform: scale(0.5); opacity: 0.8; } 21.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes f2-glow { 0%, 15% { opacity: 0; } 16% { opacity: 0.18; } 20%, 100% { opacity: 0; } }
    /* f3: check the short url for a clash */
    @keyframes f3 {
      0%, 18.75% { transform: translate(0, 0); opacity: 0; }
      19.5% { opacity: 1; }
      22.5% { transform: translate(28px, 0px); opacity: 1; }
      24%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes f3-ring { 0%, 22.5% { transform: scale(0.4); opacity: 0; } 23% { transform: scale(0.5); opacity: 0.8; } 28.75%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 28.75% { opacity: 1; } 30%, 100% { opacity: 0; } }
    /* f4: clash: go re-salt */
    @keyframes f4 {
      0%, 28.75% { transform: translate(0, 0); opacity: 0; }
      29.5% { opacity: 1; }
      33.75% { transform: translate(0px, -24px); opacity: 1; }
      35.25%, 100% { transform: translate(0px, -24px); opacity: 0; }
    }
    @keyframes f4-ring { 0%, 33.75% { transform: scale(0.4); opacity: 0; } 34.25% { transform: scale(0.5); opacity: 0.8; } 40%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes f4-glow { 0%, 33.75% { opacity: 0; } 34.75% { opacity: 0.18; } 38.75%, 100% { opacity: 0; } }
    /* f5: back to the hash function */
    @keyframes f5 {
      0%, 37.5% { transform: translate(0, 0); opacity: 0; }
      38.25% { opacity: 1; }
      41.25% { transform: translate(-60px, 0px); }
      45% { transform: translate(-60px, 60px); opacity: 1; }
      46.5%, 100% { transform: translate(-60px, 60px); opacity: 0; }
    }
    @keyframes f5-ring { 0%, 45% { transform: scale(0.4); opacity: 0; } 45.5% { transform: scale(0.5); opacity: 0.8; } 51.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes f5-glow { 0%, 45% { opacity: 0; } 46% { opacity: 0.18; } 50%, 100% { opacity: 0; } }
    /* f6: second short url checked */
    @keyframes f6 {
      0%, 48.75% { transform: translate(0, 0); opacity: 0; }
      49.5% { opacity: 1; }
      52.5% { transform: translate(28px, 0px); opacity: 1; }
      54%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes f6-ring { 0%, 52.5% { transform: scale(0.4); opacity: 0; } 53% { transform: scale(0.5); opacity: 0.8; } 58.75%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 28.75% { opacity: 0; } 30%, 57.5% { opacity: 1; } 58.75%, 100% { opacity: 0; } }
    /* f7: unique this time: save */
    @keyframes f7 {
      0%, 58.75% { transform: translate(0, 0); opacity: 0; }
      59.5% { opacity: 1; }
      62.5% { transform: translate(28px, 0px); opacity: 1; }
      64%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes f7-ring { 0%, 62.5% { transform: scale(0.4); opacity: 0; } 63% { transform: scale(0.5); opacity: 0.8; } 68.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes f7-glow { 0%, 62.5% { opacity: 0; } 63.5% { opacity: 0.18; } 67.5%, 100% { opacity: 0; } }
    /* f8: done */
    @keyframes f8 {
      0%, 66.25% { transform: translate(0, 0); opacity: 0; }
      67% { opacity: 1; }
      70% { transform: translate(28px, 0px); opacity: 1; }
      71.5%, 100% { transform: translate(28px, 0px); opacity: 0; }
    }
    @keyframes f8-ring { 0%, 70% { transform: scale(0.4); opacity: 0; } 70.5% { transform: scale(0.5); opacity: 0.8; } 76.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes f8-glow { 0%, 70% { opacity: 0; } 71% { opacity: 0.18; } 75%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 57.5% { opacity: 0; } 58.75%, 80% { opacity: 1; } 81.25%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="419" rx="12" fill="#F5F5F5" stroke="#D9DADB"/>
  <text class="t-title" x="28" y="42">URL SHORTENER</text>
  <text class="t-sub" x="28" y="66">A hash can collide; the flow re-salts and tries again until the short URL is unique, then saves once.</text>

  <g stroke="#BFC0C0" stroke-width="1">
    <line x1="120" y1="196" x2="148" y2="196"/>
    <line x1="212" y1="196" x2="240" y2="196"/>
    <line x1="320" y1="196" x2="348" y2="196"/>
    <line x1="412" y1="196" x2="440" y2="196"/>
    <line x1="520" y1="196" x2="548" y2="196"/>
    <line x1="380" y1="164" x2="380" y2="140"/>
    <path d="M340,116 H288 Q280,116 280,124 V176"/>
    <line x1="180" y1="228" x2="180" y2="300"/>
    <path d="M220,320 H572 Q580,320 580,312 V216"/>
  </g>
  <g fill="#BFC0C0">
    <polygon points="142,193 148,196 142,199"/>
    <polygon points="234,193 240,196 234,199"/>
    <polygon points="342,193 348,196 342,199"/>
    <polygon points="434,193 440,196 434,199"/>
    <polygon points="542,193 548,196 542,199"/>
    <polygon points="377,146 380,140 383,146"/>
    <polygon points="277,170 280,176 283,170"/>
    <polygon points="177,294 180,300 183,294"/>
    <polygon points="577,222 580,216 583,222"/>
  </g>

  <rect x="40" y="176" width="80" height="40" rx="20" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="80" y="193" text-anchor="middle">INPUT</text>
  <text class="t-desc" x="80" y="207" text-anchor="middle">long url</text>
  <polygon points="180,164 212,196 180,228 148,196" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-small" x="180" y="199" text-anchor="middle">IN DB?</text>
  <rect x="240" y="176" width="80" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="280" y="193" text-anchor="middle">HASH</text>
  <text class="t-desc" x="280" y="207" text-anchor="middle">base62 · 7 chars</text>
  <polygon points="380,164 412,196 380,228 348,196" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-small" x="380" y="199" text-anchor="middle">CLASH?</text>
  <rect x="440" y="176" width="80" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="480" y="193" text-anchor="middle">SAVE</text>
  <text class="t-desc" x="480" y="207" text-anchor="middle">short → long</text>
  <rect x="548" y="176" width="64" height="40" rx="20" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="580" y="193" text-anchor="middle">END</text>
  <text class="t-desc" x="580" y="207" text-anchor="middle"></text>
  <rect x="340" y="100" width="80" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="380" y="117" text-anchor="middle">RE-SALT</text>
  <text class="t-desc" x="380" y="131" text-anchor="middle">url + counter</text>
  <rect x="140" y="300" width="80" height="40" rx="7" fill="#FFFFFF" stroke="#BFC0C0"/>
  <text class="t-name" x="180" y="317" text-anchor="middle">RETURN</text>
  <text class="t-desc" x="180" y="331" text-anchor="middle">existing short</text>

  <!-- branch labels -->
  <text class="t-small" x="226" y="188" text-anchor="middle">NO</text>
  <text class="t-small" x="188" y="248">YES</text>
  <text class="t-small" x="426" y="188" text-anchor="middle">NO</text>
  <text class="t-small" x="388" y="156">YES</text>

  <text class="t-prose" x="330" y="372" text-anchor="middle">One request: a cache miss, one collision, one re-salt, then a durable save. The existing-URL branch stays cold this loop.</text>

  <!-- @motion:elements -->
  <circle cx="120" cy="196" r="4" fill="#15803D" class="pkt" style="animation-name:f1"/>
  <circle cx="148" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:f1-ring"/>
  <circle cx="212" cy="196" r="4" fill="#15803D" class="pkt" style="animation-name:f2"/>
  <circle cx="240" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:f2-ring"/>
  <rect x="240" y="176" width="80" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:f2-glow"/>
  <circle cx="320" cy="196" r="4" fill="#15803D" class="pkt" style="animation-name:f3"/>
  <circle cx="348" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:f3-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph1;opacity:0">1 · LOOKUP · MISS</text>
  <circle cx="380" cy="164" r="4" fill="#B8915A" class="pkt" style="animation-name:f4"/>
  <circle cx="380" cy="140" r="10" fill="none" stroke="#B8915A" stroke-width="1.5" class="ring" style="animation-name:f4-ring"/>
  <rect x="340" y="100" width="80" height="40" rx="6" fill="#B8915A" class="glow" style="animation-name:f4-glow"/>
  <circle cx="340" cy="116" r="4" fill="#B8915A" class="pkt" style="animation-name:f5"/>
  <circle cx="280" cy="176" r="10" fill="none" stroke="#B8915A" stroke-width="1.5" class="ring" style="animation-name:f5-ring"/>
  <rect x="240" y="176" width="80" height="40" rx="6" fill="#B8915A" class="glow" style="animation-name:f5-glow"/>
  <circle cx="320" cy="196" r="4" fill="#15803D" class="pkt" style="animation-name:f6"/>
  <circle cx="348" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:f6-ring"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#B8915A" style="animation-name:ph2;opacity:0">2 · CLASH · RE-SALT</text>
  <circle cx="412" cy="196" r="4" fill="#15803D" class="pkt" style="animation-name:f7"/>
  <circle cx="440" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:f7-ring"/>
  <rect x="440" y="176" width="80" height="40" rx="6" fill="#15803D" class="glow" style="animation-name:f7-glow"/>
  <circle cx="520" cy="196" r="4" fill="#15803D" class="pkt" style="animation-name:f8"/>
  <circle cx="548" cy="196" r="10" fill="none" stroke="#15803D" stroke-width="1.5" class="ring" style="animation-name:f8-ring"/>
  <rect x="548" y="176" width="64" height="40" rx="20" fill="#15803D" class="glow" style="animation-name:f8-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#15803D" style="animation-name:ph3;opacity:0">3 · UNIQUE · SAVE</text>
  <!-- @/motion:elements -->

  <circle cx="36" cy="396" r="4" fill="#15803D"/>
  <text class="t-name" x="46" y="400">ONE REQUEST</text>
  <circle cx="176" cy="396" r="4" fill="#B8915A"/>
  <text class="t-name" x="186" y="400">RETRY LOOP</text>
</svg>
